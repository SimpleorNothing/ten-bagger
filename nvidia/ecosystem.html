<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NVIDIA 생태계 투자·인수 타임라인</title>
  <style>
    :root{--bg:#f2f1ed;--panel:#fff;--ink:#15212c;--text:#26323d;--dim:#6e767d;--line:#d7d8d5;--blue:#315d78;--green:#2d6652;--red:#c74b3d;--gold:#9a6b1f}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;line-height:1.5}
    header{position:sticky;top:0;z-index:20;background:rgba(242,241,237,.96);border-bottom:2px solid var(--ink);backdrop-filter:blur(8px)}
    .head{max-width:1480px;margin:auto;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .eyebrow{font-size:12px;font-weight:800;color:var(--blue);letter-spacing:.08em}.title{margin:2px 0 0;font-size:24px;line-height:1.25}.back{color:var(--text);text-decoration:none;border:1px solid var(--line);background:var(--panel);padding:8px 12px;font-size:13px;font-weight:700}
    main{max-width:1480px;margin:auto;padding:22px 24px 42px}.summary{display:flex;justify-content:space-between;gap:22px;align-items:end;margin-bottom:14px}.summary p{margin:0;max-width:900px;color:var(--dim);font-size:14px}.count{white-space:nowrap;font-size:13px;font-weight:800;color:var(--blue)}
    .legend{display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;margin:12px 0;color:var(--dim);font-size:12px}.legend span:before{content:"";display:inline-block;width:12px;height:8px;margin-right:6px;background:var(--blue)}.legend .acq:before{background:var(--red)}.legend .lic:before{background:var(--green)}.legend .plan:before{background:transparent;border:1px dashed var(--red)}.toggle-all{margin-left:10px;padding:7px 12px;border:1px solid var(--blue);background:var(--panel);color:var(--blue);font:inherit;font-weight:850;cursor:pointer}.toggle-all:hover,.toggle-all:focus-visible{background:var(--blue);color:#fff}
    .wrap{overflow-x:auto;border:1px solid var(--line);background:var(--panel);box-shadow:0 8px 24px rgba(21,33,44,.06)}table{width:100%;min-width:1120px;border-collapse:collapse;table-layout:fixed}th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:top}th:last-child,td:last-child{border-right:0}thead th{position:static;padding:14px 12px;background:var(--ink);color:#fff;text-align:center;font-size:16px;line-height:1.3}thead th:first-child{position:sticky;left:0;z-index:7;width:220px;text-align:left}.layer{position:sticky;left:0;z-index:3;padding:0;background:#e6e8e7}.layer-toggle{width:100%;padding:16px 14px;border:0;background:transparent;color:var(--ink);font:inherit;font-size:15px;font-weight:850;line-height:1.45;text-align:left;cursor:pointer}.layer-toggle:after{content:'＋';float:right;color:var(--blue)}.layer-row.open .layer-toggle:after{content:'－'}.cell{padding:10px;background:var(--panel)}.year-sum{min-height:54px;padding:8px 9px;background:#f4f5f4;border:1px solid var(--line)}.year-sum b{display:block;color:var(--ink);font-size:15px}.year-sum span{display:block;margin-top:2px;color:var(--dim);font-size:11px}.year-sum .planned{color:var(--red)}.deal-list{display:none;margin-top:9px}.layer-row.open .deal-list{display:block}.deal{padding:11px;border-left:4px solid var(--blue);background:#eef3f6;font-size:13px;line-height:1.45}.deal+.deal{margin-top:9px}.deal[data-status="인수"]{border-color:var(--red);background:#fbefed}.deal[data-status="라이선스·인력"]{border-color:var(--green);background:#edf5f1}.deal[data-status="의향·협상"]{border:1px dashed var(--red);background:#fff}.deal-meta{display:flex;justify-content:space-between;gap:8px;color:var(--dim);font-size:11px}.deal-role{color:var(--blue);font-size:12px;font-weight:850}.deal-company{display:block;margin:4px 0 1px;color:var(--ink);font-size:15px;font-weight:850}.deal-amount{display:block;margin-bottom:3px;color:var(--text);font-size:13px;font-weight:800}.deal-detail{color:var(--dim);font-size:12px}.note{margin-top:12px;color:var(--dim);font-size:12px}
    .loading,.error{padding:40px;text-align:center;background:var(--panel);border:1px solid var(--line)}.error{color:var(--red)}
    @media(max-width:700px){.head{padding:14px}.title{font-size:19px}.back{padding:7px 9px}main{padding:16px 14px 32px}.summary{display:block}.count{margin-top:8px}}
  </style>
</head>
<body>
  <header><div class="head"><div><div class="eyebrow">NVIDIA · A6</div><h1 class="title">생태계 투자·인수 연도별 타임라인</h1></div><a class="back" href="../">알파맵으로 돌아가기</a></div></header>
  <main><div id="app" class="loading">타임라인을 불러오는 중입니다.</div></main>
  <script>
    (function(){
      function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
      function sums(ds){var out={firm:{},plan:{},unknown:0};ds.forEach(function(d){var bucket=d.status==='의향·협상'?out.plan:out.firm,found=false,re=/([$€£])\s*([\d.]+)\s*(B|M)/gi,m;while((m=re.exec(d.amount||''))){found=true;var v=Number(m[2])*(m[3].toUpperCase()==='M'?.001:1);bucket[m[1]]=(bucket[m[1]]||0)+v;}if(!found)out.unknown++;});return out;}
      function money(x){return ['$','€','£'].filter(function(k){return x[k];}).map(function(k){var v=x[k];return k+(v>=1?(Math.round(v*100)/100)+'B':Math.round(v*1000)+'M');}).join(' + ');}
      function sumHtml(ds){var s=sums(ds),firm=money(s.firm),plan=money(s.plan);return '<div class="year-sum"><b>'+(firm?'공개액 '+esc(firm):'공개액 —')+'</b>'+(plan?'<span class="planned">의향·협상 '+esc(plan)+'</span>':'')+'<span>'+ds.length+'건'+(s.unknown?' · 금액 미공시 '+s.unknown+'건':'')+'</span></div>';}
      function render(a){
        var years=a.timelineYears||[],groups=a.timelineGroups||[];
        var companies=groups.reduce(function(n,g){return n+(g.companies||[]).length;},0);
        var deals=groups.reduce(function(n,g){return n+(g.companies||[]).reduce(function(m,c){return m+(c.deals||[]).length;},0);},0);
        var head='<thead><tr><th>Layer · 분야</th>'+years.map(function(y){return '<th>\''+esc(String(y).slice(-2))+'</th>';}).join('')+'</tr></thead>';
        var body=groups.map(function(g,gi){return '<tr class="layer-row" data-row="'+gi+'"><td class="layer"><button class="layer-toggle" type="button" data-toggle="'+gi+'" aria-expanded="false">'+esc(g.sector)+'</button></td>'+years.map(function(y){var cards=[],yearDeals=[];(g.companies||[]).forEach(function(c){(c.deals||[]).filter(function(d){return String(d.date||'').slice(0,4)===String(y);}).forEach(function(d){yearDeals.push(d);cards.push('<div class="deal" data-status="'+esc(d.status)+'"><div class="deal-meta"><span class="deal-role">'+esc(c.role)+'</span><span>'+esc(String(d.date||'').slice(5))+'</span></div><span class="deal-company">'+esc(c.company)+'</span><span class="deal-amount">'+esc(d.amount||'금액 미공시')+'</span><div class="deal-detail">'+esc(d.detail)+'</div></div>');});});return '<td class="cell">'+sumHtml(yearDeals)+'<div class="deal-list">'+cards.join('')+'</div></td>';}).join('')+'</tr>';}).join('');
        document.getElementById('app').className='';document.getElementById('app').innerHTML='<div class="summary"><p>'+esc(a.summary)+'</p><div class="count">'+groups.length+'개 분야 · '+companies+'개 업체·묶음 · '+deals+'개 거래·발표</div></div><div class="legend"><span>전략투자·공동금융</span><span class="acq">인수</span><span class="lic">라이선스·핵심인력</span><span class="plan">의향·협상</span><button class="toggle-all" type="button" aria-expanded="false">기업 전체 펼치기</button></div><div class="wrap"><table>'+head+'<tbody>'+body+'</tbody></table></div><div class="note">합계는 공개된 명목금액 기준이며 라운드 전체 규모·최대 투자한도·공동금융을 포함할 수 있습니다. NVIDIA 단독액 미공시는 합계에서 제외했습니다. 의향·협상 금액은 확정·발표 금액과 분리했습니다. · '+esc(a.timelineNote)+'</div>';
        var allButton=document.querySelector('.toggle-all'),rows=[].slice.call(document.querySelectorAll('.layer-row'));
        function syncAll(){var allOpen=rows.length&&rows.every(function(row){return row.classList.contains('open');});allButton.setAttribute('aria-expanded',allOpen?'true':'false');allButton.textContent=allOpen?'기업 전체 접기':'기업 전체 펼치기';}
        document.querySelector('tbody').addEventListener('click',function(e){var b=e.target.closest('[data-toggle]');if(!b)return;var row=b.closest('.layer-row'),open=row.classList.toggle('open');b.setAttribute('aria-expanded',open?'true':'false');syncAll();});
        allButton.addEventListener('click',function(){var open=!rows.every(function(row){return row.classList.contains('open');});rows.forEach(function(row){row.classList.toggle('open',open);row.querySelector('[data-toggle]').setAttribute('aria-expanded',open?'true':'false');});syncAll();});
      }
      fetch('./data.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('data');return r.json();}).then(function(d){var a=(d.axes||[]).find(function(x){return x.code==='A6';});if(!a)throw new Error('A6');render(a);}).catch(function(){var app=document.getElementById('app');app.className='error';app.textContent='타임라인을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.';});
    }());
  </script>
</body>
</html>
