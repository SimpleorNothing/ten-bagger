<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NVIDIA 생태계 투자·인수 타임라인</title>
  <style>
    :root{--bg:#f2f1ed;--panel:#fff;--ink:#15212c;--text:#26323d;--dim:#6e767d;--line:#d7d8d5;--blue:#315d78;--green:#2d6652;--red:#c74b3d;--gold:#9a6b1f}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;line-height:1.5}
    header{position:sticky;top:0;z-index:20;background:rgba(242,241,237,.96);border-bottom:2px solid var(--ink);backdrop-filter:blur(8px)}
    .head{max-width:1480px;margin:auto;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .eyebrow{font-size:12px;font-weight:800;color:var(--blue);letter-spacing:.08em}.title{margin:2px 0 0;font-size:24px;line-height:1.25}.back{color:var(--text);text-decoration:none;border:1px solid var(--line);background:var(--panel);padding:8px 12px;font-size:13px;font-weight:700}
    main{max-width:1480px;margin:auto;padding:22px 24px 42px}.summary{display:flex;justify-content:space-between;gap:22px;align-items:end;margin-bottom:14px}.summary p{margin:0;max-width:900px;color:var(--dim);font-size:14px}.count{white-space:nowrap;font-size:13px;font-weight:800;color:var(--blue)}
    .legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:12px 0;color:var(--dim);font-size:12px}.legend span:before{content:"";display:inline-block;width:12px;height:8px;margin-right:6px;background:var(--blue)}.legend .acq:before{background:var(--red)}.legend .lic:before{background:var(--green)}.legend .plan:before{background:transparent;border:1px dashed var(--red)}
    .wrap{overflow-x:auto;border:1px solid var(--line);background:var(--panel);box-shadow:0 8px 24px rgba(21,33,44,.06)}table{width:100%;min-width:1080px;border-collapse:collapse;table-layout:fixed}th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:top}th:last-child,td:last-child{border-right:0}thead th{position:sticky;top:88px;z-index:5;padding:13px 10px;background:var(--ink);color:#fff;text-align:center;font-size:15px}thead th:first-child{left:0;z-index:7;width:220px;text-align:left}.sector td{padding:10px 12px;background:#e6e8e7;font-size:13px;font-weight:850;letter-spacing:.03em}.company{position:sticky;left:0;z-index:3;padding:12px;background:var(--panel)}.company b{display:block;font-size:14px}.company span{display:block;margin-top:3px;color:var(--dim);font-size:12px}.cell{padding:7px;min-height:60px}.deal{padding:9px;border-left:4px solid var(--blue);background:#eef3f6;font-size:12px}.deal+.deal{margin-top:7px}.deal[data-status="인수"]{border-color:var(--red);background:#fbefed}.deal[data-status="라이선스·인력"]{border-color:var(--green);background:#edf5f1}.deal[data-status="의향·협상"]{border:1px dashed var(--red);background:#fff}.deal-top{display:flex;justify-content:space-between;gap:6px;color:var(--dim);font-size:11px}.deal-type{font-weight:850;color:var(--blue)}.deal b{display:block;margin:3px 0;color:var(--text);font-size:13px}.note{margin-top:12px;color:var(--dim);font-size:12px}
    .loading,.error{padding:40px;text-align:center;background:var(--panel);border:1px solid var(--line)}.error{color:var(--red)}
    @media(max-width:700px){.head{padding:14px}.title{font-size:19px}.back{padding:7px 9px}main{padding:16px 14px 32px}.summary{display:block}.count{margin-top:8px}thead th{top:75px}}
  </style>
</head>
<body>
  <header><div class="head"><div><div class="eyebrow">NVIDIA · A6</div><h1 class="title">생태계 투자·인수 연도별 타임라인</h1></div><a class="back" href="../">알파맵으로 돌아가기</a></div></header>
  <main><div id="app" class="loading">타임라인을 불러오는 중입니다.</div></main>
  <script>
    (function(){
      function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
      function render(a){
        var years=a.timelineYears||[],groups=a.timelineGroups||[];
        var companies=groups.reduce(function(n,g){return n+(g.companies||[]).length;},0);
        var deals=groups.reduce(function(n,g){return n+(g.companies||[]).reduce(function(m,c){return m+(c.deals||[]).length;},0);},0);
        var head='<thead><tr><th>업체 · 분야</th>'+years.map(function(y){return '<th>\''+esc(String(y).slice(-2))+'</th>';}).join('')+'</tr></thead>';
        var body=groups.map(function(g){return '<tr class="sector"><td colspan="'+(years.length+1)+'">'+esc(g.sector)+'</td></tr>'+(g.companies||[]).map(function(c){return '<tr><td class="company"><b>'+esc(c.company)+'</b><span>'+esc(c.role)+'</span></td>'+years.map(function(y){var ds=(c.deals||[]).filter(function(d){return String(d.date||'').slice(0,4)===String(y);});return '<td class="cell">'+ds.map(function(d){return '<div class="deal" data-status="'+esc(d.status)+'"><div class="deal-top"><span class="deal-type">'+esc(d.status)+'</span><span>'+esc(String(d.date||'').slice(5))+'</span></div><b>'+esc(d.amount||'금액 미공시')+'</b><div>'+esc(d.detail)+'</div></div>';}).join('')+'</td>';}).join('')+'</tr>';}).join('');}).join('');
        document.getElementById('app').className='';document.getElementById('app').innerHTML='<div class="summary"><p>'+esc(a.summary)+'</p><div class="count">'+groups.length+'개 분야 · '+companies+'개 업체·묶음 · '+deals+'개 거래·발표</div></div><div class="legend"><span>전략투자·공동금융</span><span class="acq">인수</span><span class="lic">라이선스·핵심인력</span><span class="plan">의향·협상</span></div><div class="wrap"><table>'+head+'<tbody>'+body+'</tbody></table></div><div class="note">'+esc(a.timelineNote)+'</div>';
      }
      fetch('./data.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('data');return r.json();}).then(function(d){var a=(d.axes||[]).find(function(x){return x.code==='A6';});if(!a)throw new Error('A6');render(a);}).catch(function(){var app=document.getElementById('app');app.className='error';app.textContent='타임라인을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.';});
    }());
  </script>
</body>
</html>
