name: Sync latest EIA release once
on:
  push:
    branches: [claude/eia-sync-20260828]
permissions:
  contents: write
jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[eia-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/eia-sync-20260828
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Update EIA consumer
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('pulse.json','utf8'));
          p.asOf='2026-08-28T07:45';
          const e=(p.drivers||[]).find(x=>x.ax==='energy');
          if(!e) throw new Error('energy driver missing');
          e.dir='risk';
          e.l1='8월 26일 EIA 주간보고에서 원유재고는 단기 완충을 보였지만, 8월 STEO의 연말 재고 타이트 전망이 중기 유가 상방 위험을 유지한다.';
          e.l2='EIA WPSR는 8월 21일 종료 주간 데이터를 8월 26일 공개했다. 상업 원유재고는 전주 대비 사실상 보합 수준이었고 Cushing 재고는 증가했다. 다만 8월 STEO는 2026년 미국 원유재고 전망을 396백만 배럴로 직전 433백만 배럴보다 8.6% 낮췄으며, 상업 원유재고가 2026년 말까지 2021~2025년 범위의 저점 아래에 머물 것으로 전망한다. 단기 주간재고와 중기 구조적 타이트를 분리해 본다.';
          e.verdict='주간 재고 완충 vs STEO 중기 타이트 · 유가 상방 리스크 유지';
          e.srcs=[
            {t:'EIA Weekly Petroleum Status Report · week ending Aug. 21, 2026',u:'https://www.eia.gov/petroleum/supply/weekly/',d:'2026-08-26'},
            {t:'EIA Short-Term Energy Outlook · August 2026',u:'https://www.eia.gov/outlooks/steo/',d:'2026-08-11'}
          ];
          fs.writeFileSync('pulse.json',JSON.stringify(p,null,2)+'\n');
          let c=fs.readFileSync('changelog.js','utf8');
          const marker='  var MKT_CHANGELOG=[\n';
          const entry="    {d:'2026-08-28',t:'01 EIA 8월 26일 주간 원유재고와 8월 STEO를 재동기화 — 단기 재고 완충과 2026년 말까지의 중기 재고 타이트 전망을 분리해 유가/에너지 시장 맥락에 반영'},\n";
          if(!c.includes(entry)) c=c.replace(marker,marker+entry);
          fs.writeFileSync('changelog.js',c);
          NODE
          node -e "JSON.parse(require('fs').readFileSync('pulse.json','utf8'));"
          node --check changelog.js
          git diff --check
      - name: Commit and remove one-time workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/eia-sync-20260828.yml
          git add pulse.json changelog.js
          git commit -m 'data: sync latest EIA WPSR and STEO [eia-applied]'
          git push origin HEAD:claude/eia-sync-20260828
