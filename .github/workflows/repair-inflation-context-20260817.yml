name: Repair inflation context 2026-08-17
on:
  push:
    branches: [claude/automation-inflation-context-20260817]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[inflation-context]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/automation-inflation-context-20260817
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Restore CPI + PPI market context
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='pulse.json';
          const q=JSON.parse(fs.readFileSync(p,'utf8'));
          q.asOf='2026-08-17T07:30';
          q.model='ChatGPT automation · official sources';
          const r=(q.drivers||[]).find(x=>x.ax==='rates');
          if(!r) throw new Error('rates driver missing');
          r.dir='neutral';
          r.l1='7월 CPI는 둔화했지만 7월 PPI의 기조 생산단 물가는 높은 수준';
          r.l2='헤드라인 CPI는 전월비 +0.1%·전년비 +3.4%, 근원 CPI는 전월비 +0.2%·전년비 +2.5%로 둔화했다. 반면 최종수요 PPI는 전월비 0.0%였지만 식품·에너지·무역서비스 제외 PPI가 전월비 +0.4%·전년비 +4.7%로 높아 금리경로는 혼재. 고밸류 AI 인프라의 할인율·조달비용 부담 완화를 일방적으로 강화하는 신호로 보지 않는다.';
          r.verdict='CPI 둔화 vs 기조 PPI 압력 · 혼재';
          r.srcs=[
            {t:'BLS Consumer Price Index - July 2026',u:'https://www.bls.gov/news.release/cpi.nr0.htm',d:'2026-08-12'},
            {t:'BLS Producer Price Index - July 2026',u:'https://www.bls.gov/news.release/ppi.nr0.htm',d:'2026-08-13'}
          ];
          fs.writeFileSync(p,JSON.stringify(q,null,2)+'\n');
          NODE
      - name: Validate and commit
        run: |
          node --check scripts/sync-us-cpi-release.mjs
          node -e "const p=require('./pulse.json'); const r=p.drivers.find(x=>x.ax==='rates'); if(!r||r.srcs.length<2||!r.srcs.some(x=>/ppi/i.test(x.u||''))) process.exit(1);"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pulse.json scripts/sync-us-cpi-release.mjs
          git diff --cached --quiet || git commit -m 'fix: preserve PPI context during CPI sync [inflation-context]'
          git push origin HEAD:claude/automation-inflation-context-20260817
