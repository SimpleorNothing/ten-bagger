name: Repair inflation context 2026-08-17
on:
  push:
    branches: [claude/automation-inflation-context-20260817]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[inflation-context]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/automation-inflation-context-20260817
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Restore PPI context and prevent CPI overwrite
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='pulse.json';
          const q=JSON.parse(fs.readFileSync(p,'utf8'));
          q.asOf='2026-08-17T07:30';
          q.model='ChatGPT automation · official sources';
          const r=(q.drivers||[]).find(x=>x.ax==='rates');
          if(!r) throw new Error('rates driver missing');
          r.dir='neutral';
          r.l1='7월 CPI는 둔화했지만 7월 PPI의 기조 생산단 물가는 높은 수준';
          r.l2='헤드라인 CPI는 전월비 +0.1%·전년비 +3.4%, 근원 CPI는 전월비 +0.2%·전년비 +2.5%로 둔화했다. 반면 최종수요 PPI는 전월비 0.0%였지만 식품·에너지·무역서비스 제외 PPI가 전월비 +0.4%·전년비 +4.7%로 높아 금리경로는 혼재. 고밸류 AI 인프라의 할인율·조달비용 부담 완화를 일방적으로 강화하는 신호로 보지 않는다.';
          r.verdict='CPI 둔화 vs 기조 PPI 압력 · 혼재';
          r.srcs=[
            {t:'BLS Consumer Price Index - July 2026',u:'https://www.bls.gov/news.release/cpi.nr0.htm',d:'2026-08-12'},
            {t:'BLS Producer Price Index - July 2026',u:'https://www.bls.gov/news.release/ppi.nr0.htm',d:'2026-08-13'}
          ];
          fs.writeFileSync(p,JSON.stringify(q,null,2)+'\n');

          const sfile='scripts/sync-us-cpi-release.mjs';
          let s=fs.readFileSync(sfile,'utf8');
          const old=`    rates.l1 = \`${month}월 CPI 전년비 \${headlineYoy.toFixed(1)}%, 근원 CPI \${coreYoy.toFixed(1)}%로 직전월보다 둔화\`;\n    rates.l2 = \`헤드라인 CPI 전월비 \${fmt(headlineMom)}, 근원 \${fmt(coreMom)}로 물가 재가속 우려가 완화됐다. Fed의 금리경로에는 완화적 입력이며 고밸류 AI 인프라의 할인율·조달비용 부담을 일부 낮추는 방향.\`;\n    rates.verdict = '물가 둔화 · 금리 부담 완화';\n    rates.srcs = [{t:\`BLS Consumer Price Index - \${monthName} \${year}\`,u:URL,d:releaseDate}];`;
          const neu=`    const existingPpi = Array.isArray(rates.srcs) ? rates.srcs.find(x => /producer price|ppi/i.test(String(x?.t||'')) || /ppi\\.nr0/.test(String(x?.u||''))) : null;\n    if (existingPpi) {\n      rates.dir = 'neutral';\n      rates.l1 = \`${month}월 CPI는 둔화했지만 최근 PPI의 기조 생산단 물가 압력은 병존\`;\n      rates.l2 = \`헤드라인 CPI 전월비 \${fmt(headlineMom)}·전년비 \${fmt(headlineYoy)}, 근원 CPI 전월비 \${fmt(coreMom)}·전년비 \${fmt(coreYoy)}로 소비자물가는 둔화했다. 다만 최근 공식 PPI에서 확인된 기조 생산단 물가 압력도 함께 보존해 금리경로를 혼재로 판단한다.\`;\n      rates.verdict = 'CPI 둔화 vs 기조 PPI 압력 · 혼재';\n      rates.srcs = [{t:\`BLS Consumer Price Index - \${monthName} \${year}\`,u:URL,d:releaseDate}, existingPpi];\n    } else {\n      rates.l1 = \`${month}월 CPI 전년비 \${headlineYoy.toFixed(1)}%, 근원 CPI \${coreYoy.toFixed(1)}%로 직전월보다 둔화\`;\n      rates.l2 = \`헤드라인 CPI 전월비 \${fmt(headlineMom)}, 근원 \${fmt(coreMom)}로 물가 재가속 우려가 완화됐다. Fed의 금리경로에는 완화적 입력이며 고밸류 AI 인프라의 할인율·조달비용 부담을 일부 낮추는 방향.\`;\n      rates.verdict = '물가 둔화 · 금리 부담 완화';\n      rates.srcs = [{t:\`BLS Consumer Price Index - \${monthName} \${year}\`,u:URL,d:releaseDate}];\n    }`;
          if(!s.includes(old)) throw new Error('CPI pulse block target not found');
          s=s.replace(old,neu);
          fs.writeFileSync(sfile,s);
          NODE
      - name: Validate and commit
        run: |
          node --check scripts/sync-us-cpi-release.mjs
          node -e "const p=require('./pulse.json'); const r=p.drivers.find(x=>x.ax==='rates'); if(!r||r.srcs.length<2||!r.srcs.some(x=>/ppi/i.test(x.u||''))) process.exit(1);"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pulse.json scripts/sync-us-cpi-release.mjs
          git diff --cached --quiet || git commit -m 'fix: preserve PPI context during CPI sync [inflation-context]'
          git push origin HEAD:claude/automation-inflation-context-20260817
