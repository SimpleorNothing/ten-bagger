name: Verify NFP live once

# simpleornothing.com is Cloudflare Access protected for non-browser automation; verify the deployed Worker origin directly.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-nfp-live.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed NFP data and renderer
        run: |
          set -euo pipefail
          BASE='https://ten-bagger.cw120-park.workers.dev'
          curl -fsSL --retry 3 --retry-delay 2 "$BASE/nfp.json" -o /tmp/nfp.json
          curl -fsSL --retry 3 --retry-delay 2 "$BASE/" -o /tmp/index.html
          node - <<'NODE'
          const fs=require('fs');
          const n=JSON.parse(fs.readFileSync('/tmp/nfp.json','utf8'));
          const m=Object.fromEntries(n.levels);
          const d=(a,b)=>m[b]-m[a];
          console.log('LIVE nfp.json:', {may:d('2026-04-01','2026-05-01'), june:d('2026-05-01','2026-06-01'), july:d('2026-06-01','2026-07-01'), asOf:n.asOf});
          if(d('2026-04-01','2026-05-01')!==63) throw new Error('live May is not +63K');
          if(d('2026-05-01','2026-06-01')!==20) throw new Error('live June is not +20K');
          if(d('2026-06-01','2026-07-01')!==-23) throw new Error('live July is not -23K');
          const h=fs.readFileSync('/tmp/index.html','utf8');
          if(!h.includes('live.concat(bk.levels||[])')) throw new Error('live renderer is not BLS-priority');
          if(h.includes('(bk.levels||[]).concat(live).forEach')) throw new Error('stale FRED-priority renderer remains live');
          console.log('LIVE static assets: BLS-priority renderer OK');
          NODE

      - name: Verify rendered NFP card in browser
        run: |
          set -euo pipefail
          mkdir -p /tmp/nfp-live && cd /tmp/nfp-live
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          cat > check.js <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1200}});
            await page.goto('https://ten-bagger.cw120-park.workers.dev/',{waitUntil:'networkidle',timeout:90000});
            await page.waitForTimeout(4000);
            const result=await page.evaluate(()=>{
              const all=[...document.querySelectorAll('*')];
              const title=all.find(e=>e.children.length===0 && (e.textContent||'').trim()==='미국 비농업고용(NFP)');
              if(!title) return {found:false, body:(document.body.innerText||'').slice(0,1500)};
              let p=title;
              for(let i=0;i<6 && p;i++,p=p.parentElement){
                const t=(p.innerText||'').trim();
                if(t.includes('미국 비농업고용(NFP)') && (t.includes('전월비')||t.includes('고용 감소'))) return {found:true,text:t};
              }
              return {found:true,text:(title.parentElement?.innerText||title.textContent||'')};
            });
            console.log('LIVE CARD:', JSON.stringify(result,null,2));
            if(!result.found) throw new Error('NFP card not found on deployed Worker page');
            if(!/(^|\s)-23K(\s|$)/.test(result.text)) throw new Error('live card does not show -23K');
            if(!/전월비\s*-43K/.test(result.text)) throw new Error('live card does not show 전월비 -43K');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node check.js
