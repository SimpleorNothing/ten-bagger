name: Fix market startup v2
on:
  push:
    branches: ["fix/market-startup-unblock-v2-20260912"]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/market-startup-unblock-v2-20260912
      - name: Patch worker startup guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker-hotfix.js'); s=p.read_text()
          old="""el.prepend(`<script>(function(){var st=document.createElement('style');st.textContent='#v-market.on{display:none!important}';document.head.appendChild(st);var o=new MutationObserver(function(){var n=document.getElementById('nav');if(n){var b=n.querySelector('[data-v=\"company\"]');if(!b){b=document.createElement('button');b.className='tab';b.dataset.v='company';b.innerHTML='<span class=\"n\">02</span>기업분석';var m=n.querySelector('[data-v=\"market\"]');if(m)n.insertBefore(b,m.nextSibling);else n.appendChild(b)}Array.prototype.forEach.call(n.querySelectorAll('.tab'),function(x){x.classList.toggle('on',x===b)});var s=document.querySelector('script[data-company-analysis-loader]');if(!s){s=document.createElement('script');s.src='/company.js?v=20260902-initial-company';s.setAttribute('data-company-analysis-loader','1');document.head.appendChild(s)}}if(document.getElementById('v-company')){st.remove();o.disconnect()}});o.observe(document.documentElement,{childList:true,subtree:true});})();</scr` + `ipt>`, { html: true });"""
          new="""el.prepend(`<script>(function(){var st=document.createElement('style');st.textContent='#v-market.on{display:none!important}';document.head.appendChild(st);var o=null;function done(){if(st&&st.isConnected)st.remove();if(o)o.disconnect()}function sync(){var n=document.getElementById('nav');if(n){var b=n.querySelector('[data-v=\"company\"]');var m=n.querySelector('[data-v=\"market\"]');if(m&&!m.__marketStartupUnblock){m.__marketStartupUnblock=1;m.addEventListener('click',done,true)}if(!b){b=document.createElement('button');b.className='tab';b.dataset.v='company';b.innerHTML='<span class=\"n\">02</span>기업분석';if(m)n.insertBefore(b,m.nextSibling);else n.appendChild(b)}Array.prototype.forEach.call(n.querySelectorAll('.tab'),function(x){x.classList.toggle('on',x===b)});var s=document.querySelector('script[data-company-analysis-loader]');if(!s){s=document.createElement('script');s.src='/company.js?v=20260902-initial-company';s.setAttribute('data-company-analysis-loader','1');document.head.appendChild(s)}}if(document.getElementById('v-company'))done()}o=new MutationObserver(sync);o.observe(document.documentElement,{childList:true,subtree:true});sync();setTimeout(done,5000);})();</scr` + `ipt>`, { html: true });"""
          if old not in s: raise SystemExit('startup anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check worker-hotfix.js
      - name: Commit worker only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add worker-hotfix.js
          git commit -m "fix: keep 01 accessible during company startup"
          git push origin HEAD:fix/market-startup-unblock-v2-20260912
