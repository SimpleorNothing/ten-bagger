name: Apply Sep 12 Alpha Audit Corrections
on:
  push:
    paths:
      - '.github/workflows/alpha-audit-fix-20260912.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply verified data corrections
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          CHECKED = '2026-09-12T07:55:00Z'
          SOURCE_UPDATED = 'Sep 12, 2026 14:25 EST'
          SOURCE_URL = 'https://au.investing.com/central-banks/fed-rate-monitor'
          probs = [2.6, 22.7, 47.3, 27.4]
          labels = [('3.50%–3.75%',3.5,3.75),('3.75%–4.00%',3.75,4.0),('4.00%–4.25%',4.0,4.25),('4.25%–4.50%',4.25,4.5)]
          expected = round(sum(p*((lo+hi)/2) for p,(_,lo,hi) in zip(probs,labels))/100,4)

          # FedWatch: CME token unavailable in the automation runner. Use the directly
          # web-verified Investing.com display as the allowed 2nd-priority source.
          p = Path('fedwatch.json')
          d = json.loads(p.read_text())
          d['source'] = 'Investing.com Fed Rate Monitor'
          d['sourceUrl'] = SOURCE_URL
          d['asOf'] = '2026-09-12'
          d['checkedAt'] = CHECKED
          d['status'] = '확인됨(2순위)'
          d['statusReason'] = ('CME FedWatch End-of-Day API는 자동화 실행환경에서 CME_FEDWATCH_TOKEN을 사용할 수 없어 직접 검증하지 못함. '
                               'Investing.com Fed Rate Monitor 표시값을 웹에서 직접 검증해 2순위로 사용. '
                               f'원문 Updated={SOURCE_UPDATED}; 이전 9/11 값을 최신값처럼 유지하지 않음.')
          d['futurePrice'] = 95.910
          d['sourceUpdatedAt'] = SOURCE_UPDATED
          hist = [x for x in d.get('history',[]) if (x.get('sourceDate') or x.get('date')) != '2026-09-12']
          hist.append({
              'date':'2026-09-12','sourceDate':'2026-09-12','checkedAt':CHECKED,'expectedRate':expected,
              'ranges':[{'label':lab,'low':lo,'high':hi,'probability':prob} for prob,(lab,lo,hi) in zip(probs,labels)],
              'source':'Investing.com Fed Rate Monitor','sourceUpdatedAt':SOURCE_UPDATED,
              'inputs':{'updated':SOURCE_UPDATED,'futurePrice':'95.910','basis':'CME Group 30-Day Fed Fund futures','parser':'direct-web-verified-summary'},
              'futurePrice':95.910
          })
          d['history'] = hist
          checks = [x for x in d.get('checks',[]) if x.get('date') != '2026-09-12']
          checks.append({
              'date':'2026-09-12','checkedAt':CHECKED,'status':'확인됨(2순위)',
              'source':'Investing.com Fed Rate Monitor','sourceDate':'2026-09-12','sourceUpdatedAt':SOURCE_UPDATED,
              'reason':('CME EOD API token unavailable in automation runner. Investing.com direct web display verified: '
                        'Future Price 95.910; probabilities 2.6/22.7/47.3/27.4%; <=4.00% cumulative 25.3%.') ,
              'inputs':{'updated':SOURCE_UPDATED,'futurePrice':'95.910','basis':'CME Group 30-Day Fed Fund futures','parser':'direct-web-verified-summary'}
          })
          d['checks'] = checks
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2)+'\n')

          # Latest held-company material news: Tesla Semi European-market rollout.
          p = Path('news_digest.json')
          n = json.loads(p.read_text())
          n['asOf'] = '2026-09-12T16:55:00+09:00'
          n['headline'] = ('9/12 토요일 신규 자산현황 원본은 아직 확인되지 않아 9/5 최신 가용 원장을 유지한다. '
                           '최신 보유뉴스로 Tesla Semi의 유럽 화물시장 진출 계획을 추가한다. Micron 대만 보상안, '
                           'OpenAI–Samsung 협력, Samsung-ASML High NA EUV, Cybercab NHTSA 조사, AVGO·CRDO 실적은 기존 추적 상태를 유지한다.')
          item = {
              'tk':'TSLA','nm':'테슬라','date':'2026-09-11',
              'fact':('Tesla가 IAA Transportation에서 Semi의 유럽 화물시장 진출 계획을 공개할 예정이며, Reuters는 유럽형 Semi가 40t 총중량 기준 최대 550km 주행, 약 1kWh/km 소비, Megacharger로 30분 내 주행거리 60% 회복을 제시했다고 보도했다. 대량생산 목표는 2026년이다.'),
              'meaning':('Cybercab와 별개로 상용차 제품 축의 시장 확대 신호다. 유럽의 기존 전기 대형트럭 경쟁사와 충전 인프라·차량중량 규제가 있어 발표 자체를 매출로 간주하지 않고 실제 주문·생산 램프를 확인한다.'),
              'impact':'긍정-관찰','next':'IAA 공식 세부사양·유럽 출시국/가격·고객 주문·Nevada 생산 램프·Megacharger 구축·상용차 마진',
              'response':'관찰','source':'Reuters · 2026-09-11',
              'url':'https://www.reuters.com/business/autos-transportation/tesla-eyes-european-freight-market-with-long-delayed-semi-truck-2026-09-11/'
          }
          n['news'] = [x for x in n.get('news',[]) if not (x.get('tk')=='TSLA' and x.get('date')=='2026-09-11')] 
          n['news'].insert(0,item)
          p.write_text(json.dumps(n, ensure_ascii=False, indent=2)+'\n')

          # Pulse: synchronize latest signals, FedWatch and held-company news without paid LLM.
          p = Path('pulse.json')
          pulse = json.loads(p.read_text())
          pulse['asOf'] = '2026-09-12T16:55:00+09:00'
          pulse['model'] = 'ChatGPT automation · official releases first · holdings 2026-09-05 latest available Saturday source · no paid external LLM API'
          old = pulse.get('headline','')
          pulse['headline'] = (old.replace('signals는 9/10 VIX 17.84·Fear&Greed 33', 'signals는 9/11 VIX 15.84·Fear&Greed 33')
                                  .replace('FedWatch의 12월 3.75~4.00% 이하 확률은 39.8%(원문 Updated Sep 11, 2026 03:45AM EDT)',
                                           'FedWatch의 12월 3.75~4.00% 이하 확률은 25.3%(Investing.com 2순위, 원문 Updated Sep 12, 2026 14:25 EST)'))
          if 'Tesla Semi' not in pulse['headline']:
              pulse['headline'] += ' Tesla Semi의 유럽 진출 계획은 상용차 제품 확대 옵션이지만 실제 주문·생산 램프 전에는 매출로 선반영하지 않는다.'
          for drv in pulse.get('drivers',[]):
              if drv.get('ax') == 'rates':
                  drv['l2'] = drv.get('l2','') + ' FedWatch 12월 3.75~4.00% 이하 누적확률은 25.3%(Investing.com 2순위, Updated Sep 12, 2026 14:25 EST)로 9/11의 39.8%에서 낮아졌다.'
                  drv['verdict'] = 'CPI 혼재 + FedWatch 인상/고금리 쪽 이동 · 할인율 부담 관찰'
                  srcs = drv.setdefault('srcs',[])
                  srcs.append({'t':'Investing.com Fed Rate Monitor · Dec 2026','u':SOURCE_URL,'d':'2026-09-12'})
              if drv.get('ax') == 'sentiment':
                  drv['l1'] = ('signals는 2026-09-11 기준 VIX 15.84·Fear&Greed 33으로 공포권이 유지된다. Micron 대만 대규모 보상안은 파업 리스크 완화 신호지만 노사 합의 전이고, Tesla Cybercab NHTSA 조사와 별개로 Semi 유럽 진출 계획은 제품 확대의 긍정 옵션이다.')
                  drv['l2'] = drv.get('l2','') + ' Tesla Semi는 유럽 화물시장 진출 계획을 제시했으나 실제 주문·생산 램프·충전망을 확인하기 전까지 판매 실적으로 간주하지 않는다.'
                  drv['verdict'] = '공포권 유지 · MU 노사/TSLA 규제와 Semi 유럽 확장 동시 관찰'
                  drv.setdefault('srcs',[]).insert(0,{'t':'Reuters · Tesla Semi Europe rollout','u':item['url'],'d':'2026-09-11'})
          p.write_text(json.dumps(pulse, ensure_ascii=False, indent=2)+'\n')

          # Audit trail: source, dates, reason and data-consumer changes.
          p = Path('audit/official-release-checks/2026-09-12.json')
          a = json.loads(p.read_text())
          a['fedwatchVerification'] = {
              'status':'corrected','primary':'CME EOD API unavailable in automation runner (token unavailable)',
              'secondary':'Investing.com Fed Rate Monitor direct web verification','sourceDate':'2026-09-12',
              'sourceUpdatedAt':SOURCE_UPDATED,'sourceUrl':SOURCE_URL,'futurePrice':95.910,
              'probabilitiesPct':[2.6,22.7,47.3,27.4],'cumulativeLe4Pct':25.3,
              'reason':'9/11 verified snapshot was not retained as latest after a newer directly verified 9/12 display became available.'
          }
          a['consumerCorrections'] = {
              'pulseSignals':'9/10 VIX 17.84 -> 9/11 VIX 15.84; Fear&Greed remains 33',
              'pulseFedWatch':'<=4.00% 39.8% (Sep11) -> 25.3% (Sep12 direct web verified)',
              'newsDigest':'added Tesla Semi Europe rollout (Reuters 2026-09-11)',
              'paidExternalLlmUsed':False
          }
          p.write_text(json.dumps(a, ensure_ascii=False, indent=2)+'\n')
          PY
      - name: Commit corrected data and remove one-time helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/alpha-audit-fix-20260912.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fedwatch.json pulse.json news_digest.json audit/official-release-checks/2026-09-12.json .github/workflows/alpha-audit-fix-20260912.yml
          git commit -m "fix: synchronize Sep 12 audit data"
          git push origin HEAD:${GITHUB_REF_NAME}
