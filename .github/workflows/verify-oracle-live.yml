name: Verify Oracle release live

on:
  workflow_run:
    workflows: ["Deploy to Cloudflare Workers"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
    steps:
      - name: Verify Oracle JSON, all consumers, 01 card and RPO chart
        run: |
          set -euo pipefail
          if [ -z "${SITE_PASSWORD:-}" ]; then echo 'ERROR: SITE_PASSWORD required'; exit 1; fi
          mkdir -p /tmp/oracle-live && cd /tmp/oracle-live
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          cat > check.js <<'NODE'
          const { chromium } = require('playwright');
          const BASE='https://simpleornothing.com';
          const pw=process.env.SITE_PASSWORD;
          const need=(text, parts, label)=>{for(const p of parts) if(!text.includes(p)) throw new Error(label+' missing '+p)};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:1440,height:2200}});
            const auth=await context.request.post(BASE+'/__auth',{form:{password:pw},timeout:30000});
            if(!auth.ok()) throw new Error('site auth failed: HTTP '+auth.status());
            async function json(path){const r=await context.request.get(BASE+'/'+path+'?t='+Date.now(),{timeout:30000,headers:{'Cache-Control':'no-cache'}});if(!r.ok())throw new Error(path+' HTTP '+r.status());return r.json();}
            async function text(path){const r=await context.request.get(BASE+'/'+path+'?t='+Date.now(),{timeout:30000,headers:{'Cache-Control':'no-cache'}});if(!r.ok())throw new Error(path+' HTTP '+r.status());return r.text();}
            const j=await json('oracle_q1fy27.json');
            const z=j.latest||{}, p=j.previousQuarter||{}, g=j.guidance||{}, last=(j.series||[]).at(-1);
            if(j.period!=='FY27 Q1'||j.registeredAt!=='2026-09-10'||z.revenueB!==19.345||z.cloudRevenueB!==11.607||z.iaasRevenueB!==7.4||z.iaasRevenueYoy!==121||z.rpoB!==664||z.capexB!==28.499||z.freeCashFlowB!==-5.396||p.rpoB!==638||g.revenueGrowthPct?.[0]!==30||g.revenueGrowthPct?.[1]!==34||g.cloudRevenueGrowthUsdPct?.[0]!==65||g.cloudRevenueGrowthUsdPct?.[1]!==71||last?.period!=='FY27 Q1'||last?.rpoB!==664) throw new Error('live Oracle canonical JSON mismatch');
            const calendar=JSON.stringify(await json('calendar.json'));
            const pulse=JSON.stringify(await json('pulse.json'));
            const cycle=JSON.stringify(await json('cycle.json'));
            const risk=JSON.stringify(await json('risk.json'));
            const signal=JSON.stringify(await json('signal_log.json'));
            need(calendar,['Oracle FY27 Q1 실적','OCI $7.4B','RPO $664B'],'calendar');
            need(pulse,['Oracle FY27 Q1','RPO $664B','CAPEX $28.499B'],'pulse');
            need(cycle,['Oracle FY27 Q1','"rpoB":664','"capexB":28.499'],'cycle');
            need(risk,['Oracle FY27 Q1','CAPEX $28.499B','FCF -$5.396B'],'risk');
            need(signal,['Oracle FY27 Q1 공식 실적','OCI/IaaS $7.4B','RPO $664B'],'signal_log');
            const aisd=await text('aisd.js');
            const council=await text('council-view-collapse.js');
            need(aisd,['Oracle FY27 Q1','OCI <b>$7.4B(+121%)</b>','RPO <b>$664B</b>'],'02 aisd');
            need(council,['Oracle FY27 Q1 공식 보조신호','OCI $7.4B(+121% YoY)','RPO $664B'],'04 council');
            const page=await context.newPage(); const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            await page.goto(BASE+'/?oracle-release-smoke='+Date.now(),{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForSelector('#nav .tab[data-v="market"]',{state:'visible',timeout:30000});
            await page.waitForFunction(()=>document.body.classList.contains('company-default-ready'),{timeout:30000});
            await page.click('#nav .tab[data-v="market"]');
            await page.waitForFunction(()=>document.getElementById('v-market')?.classList.contains('on'),{timeout:10000});
            await page.waitForSelector('#mkt_oracle_q1fy27',{state:'visible',timeout:45000});
            await page.waitForFunction(()=>{const t=document.querySelector('#mkt_oracle_q1fy27')?.innerText||'';return t.includes('OCI $7.4B')&&t.includes('+ 121% YoY')&&t.includes('$638B → $664B')&&t.includes('CAPEX $28.499B')&&t.includes('FCF $-5.396B')&&t.includes('FY27 Q1')&&t.includes('등록 2026-09-10');},{timeout:45000});
            const card=await page.evaluate(()=>{const el=document.getElementById('mkt_oracle_q1fy27');return {text:(el?.innerText||'').trim(),hasSvg:!!el?.querySelector('svg')};});
            console.log('LIVE ORACLE CARD:',JSON.stringify(card,null,2));
            if(!card.hasSvg) throw new Error('Oracle RPO chart missing');
            const fatal=errors.filter(e=>/SyntaxError|oracle_q1fy27|mkt_oracle/i.test(e));if(fatal.length)throw new Error('production Oracle browser errors: '+JSON.stringify(fatal));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node check.js
