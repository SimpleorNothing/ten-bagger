name: NHPLUG balance schema probe

on:
  push:
    branches:
      - 'fix/account-live-nhplug-fields-20260912'
    paths:
      - '.github/workflows/nhplug-schema-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      NHPLUG_APP_SECRET: ${{ secrets.NHPLUG_APP_SECRET }}
    steps:
      - name: Probe sanitized balance schema only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NHPLUG_APP_SECRET"
          TOKEN=$(python - <<'PY'
          import hashlib, os
          secret = os.environ['NHPLUG_APP_SECRET']
          print(hashlib.sha256(f'alpha-map:portfolio-read:v1:{secret}'.encode()).hexdigest())
          PY
          )
          code=$(curl -sS --connect-timeout 10 --max-time 30 \
            -H "x-portfolio-api-token: ${TOKEN}" \
            -H 'Cache-Control: no-cache' \
            -o /tmp/live.json \
            -w '%{http_code}' \
            "https://simpleornothing.com/api/portfolio/live?t=$(date +%s%N)")
          echo "HTTP ${code}"
          test "$code" = "200"
          node <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/live.json','utf8'));
          const keys=o=>o&&typeof o==='object'&&!Array.isArray(o)?Object.keys(o).sort():[];
          const rows=v=>Array.isArray(v)?v:[];
          console.log('source=', j.source, 'readOnly=', j.readOnly, 'accounts=', rows(j.accounts).length);
          rows(j.accounts).forEach((a,i)=>{
            const d=a.domestic||{};
            console.log(`account[${i}] domestic Output_0 keys:`, keys(Array.isArray(d.Output_0)?d.Output_0[0]:d.Output_0).join(','));
            console.log(`account[${i}] domestic Output_1 rows:`, rows(d.Output_1).length);
            console.log(`account[${i}] domestic Output_1 keys:`, keys(rows(d.Output_1)[0]).join(','));
            rows(a.overseas).forEach((x,k)=>{
              const o=x.data||{};
              console.log(`account[${i}] overseas[${k}] Output_0 keys:`, keys(Array.isArray(o.Output_0)?o.Output_0[0]:o.Output_0).join(','));
              console.log(`account[${i}] overseas[${k}] Output_1 rows:`, rows(o.Output_1).length);
              console.log(`account[${i}] overseas[${k}] Output_1 keys:`, keys(rows(o.Output_1)[0]).join(','));
            });
          });
          NODE
