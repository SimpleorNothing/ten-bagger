name: Apply annual cloud line chart

# trigger label overlap fix
on:
  push:
    branches:
      - fix/annual-chart-label-overlap-apply
    paths:
      - .github/workflows/apply-annual-cloud-chart-direct.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/annual-chart-label-overlap-apply
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source update
        run: python scripts/apply_annual_cloud_chart.py
      - name: Validate
        run: |
          node --check aisd.js
          git diff --check
      - name: Commit source update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aisd.js
          git commit -m "fix: separate annual cloud chart value labels"
          git push origin HEAD:fix/annual-chart-label-overlap-apply
