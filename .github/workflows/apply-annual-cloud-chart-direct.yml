name: Apply annual cloud chart direct

on:
  push:
    branches:
      - fix/direct-annual-cloud-chart
    paths:
      - .github/workflows/apply-annual-cloud-chart-direct.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/direct-annual-cloud-chart
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source update
        run: python scripts/apply_annual_cloud_chart.py
      - name: Validate
        run: |
          node --check aisd.js
          git diff --check
      - name: Commit source update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aisd.js
          git commit -m "fix: directly add 2024-2030 annual cloud RPO revenue CAPEX chart"
          git push origin HEAD:fix/direct-annual-cloud-chart
