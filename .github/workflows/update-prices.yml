name: Update stock prices

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-prices.yml'
      - 'index.html'
      - 'scripts/fetch-prices.mjs'
  schedule:
    - cron: '5 21 * * *'
    - cron: '35 21 * * *'
    - cron: '52 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch and validate latest prices (retry ×3)
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3; do
            echo "price refresh attempt $attempt/3"
            if node scripts/fetch-prices.mjs \
              && node scripts/fetch-gamma.mjs \
              && node scripts/derive-cycle-e.mjs \
              && node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('prices.json', 'utf8'));
          const c = JSON.parse(fs.readFileSync('charts.json', 'utf8'));
          const now = new Date();
          if (now.getUTCHours() >= 20) {
            const today = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()) / 86400000;
            const asOfDay = String(p.asOf || '').slice(0, 10);
            for (const id of ['gspc', 'ixic', 'us10y']) {
              if (!p.quotes?.[id] || !Number.isFinite(Number(p.quotes[id].price))) throw new Error('required quote missing: ' + id);
              const s = c.series?.[id];
              const last = s?.t?.[s.t.length - 1];
              if (!(Number.isFinite(last) && today - last <= 3)) throw new Error('stale chart for ' + id + ': today ' + today + ', got ' + last);
            }
            if (asOfDay !== now.toISOString().slice(0, 10)) throw new Error('stale prices.asOf: expected ' + now.toISOString().slice(0, 10) + ', got ' + asOfDay);
          }
          console.log('price freshness validation passed');
          NODE
            then ok=1; break; fi
            echo "attempt $attempt failed; waiting before retry"
            sleep $((attempt * 15))
          done
          test "$ok" -eq 1
      - name: Rebase data generation onto latest main
        shell: bash
        run: |
          set -euo pipefail
          START_SHA=$(git rev-parse HEAD)
          git fetch origin main
          LATEST_SHA=$(git rev-parse origin/main)
          if [ "$START_SHA" != "$LATEST_SHA" ]; then
            echo "main moved during price refresh: $START_SHA -> $LATEST_SHA; regenerating from latest main"
            git reset --hard origin/main
            node scripts/fetch-prices.mjs
            node scripts/fetch-gamma.mjs
            node scripts/derive-cycle-e.mjs
          fi
      - name: Create protected-main PR when changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILES="prices.json charts.json gamma.json cycle.json holdings.json"
          if [ -z "$(git status --porcelain $FILES)" ]; then
            echo "No change in $FILES."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="claude/automation-update-prices-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$BRANCH"
          git add $FILES
          git commit -m "chore: update stock prices + 1y charts"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "chore: update stock prices + 1y charts" --body "Automated market-data refresh. Claude PR Gate validates and squash-merges this protected-main PR."
