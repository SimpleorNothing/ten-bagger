name: Update stock prices

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-prices.yml'
      - 'index.html'
      - 'scripts/fetch-prices.mjs'
      - 'scripts/fetch-gamma.mjs'
      - 'scripts/fetch-revision-benchmark.mjs'
      - 'scripts/build-investment-scores.mjs'
      - 'scripts/fetch-revision-provenance.mjs'
      - 'scripts/validate-revision-provenance.mjs'
      - 'scripts/audit-revision-integrity.mjs'
      - 'scripts/build-revision-report.mjs'
  schedule:
    - cron: '5 21 * * *'
    - cron: '35 21 * * *'
    - cron: '52 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch and validate latest prices + sourced revisions (retry ×3)
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3; do
            echo "market refresh attempt $attempt/3"
            if node scripts/fetch-prices.mjs \
              && git checkout -- holdings.json \
              && node scripts/fetch-gamma.mjs \
              && node scripts/fetch-revision-benchmark.mjs \
              && node scripts/fetch-revision-provenance.mjs \
              && node scripts/validate-revision-provenance.mjs \
              && node scripts/audit-revision-integrity.mjs \
              && node scripts/build-revision-report.mjs \
              && node scripts/derive-cycle-e.mjs \
              && node scripts/build-investment-scores.mjs \
              && node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('prices.json', 'utf8'));
          const c = JSON.parse(fs.readFileSync('charts.json', 'utf8'));
          const g = JSON.parse(fs.readFileSync('gamma.json', 'utf8'));
          const rr = JSON.parse(fs.readFileSync('raw/revisions/latest.json', 'utf8'));
          const rb = JSON.parse(fs.readFileSync('revision-benchmark.json', 'utf8'));
          const sc = JSON.parse(fs.readFileSync('scores.json', 'utf8'));
          const h = JSON.parse(fs.readFileSync('holdings.json', 'utf8'));
          const now = new Date();
          if (!/^\d{4}-\d{2}-\d{2}$/.test(String(h.qtyAsOf || '')) || new Date(h.qtyAsOf + 'T00:00:00Z').getUTCDay() !== 6)
            throw new Error('holdings must remain latest Saturday Excel snapshot');
          if (h.asOf !== h.qtyAsOf) throw new Error('price refresh mutated holdings.asOf: ' + h.asOf + ' vs ' + h.qtyAsOf);
          if (now.getUTCHours() >= 20) {
            const today = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()) / 86400000;
            const asOfDay = String(p.asOf || '').slice(0, 10);
            for (const id of ['gspc', 'ixic', 'us10y']) {
              if (!p.quotes?.[id] || !Number.isFinite(Number(p.quotes[id].price))) throw new Error('required quote missing: ' + id);
              const s = c.series?.[id];
              const last = s?.t?.[s.t.length - 1];
              if (!(Number.isFinite(last) && today - last <= 3)) throw new Error('stale chart for ' + id);
            }
            if (asOfDay !== now.toISOString().slice(0, 10)) throw new Error('stale prices.asOf: ' + asOfDay);
          }
          if (rb.schema !== 'revision-benchmark-v2' || rb.universe !== 'Nasdaq-100' || !rb.distributions || !rb.ranks) throw new Error('revision benchmark metadata invalid');
          if (sc.schema !== 'investment-scores-v4' || sc.displayedModel !== 'v4' || sc.benchmarkAsOf !== rb.asOf) throw new Error('investment score snapshot invalid');
          if (!g.revisionAudit || !g.revisionIntegrity) throw new Error('revision audit/integrity missing');
          if (!Array.isArray(rr.rows) || !rr.rows.length) throw new Error('revision report rows missing');
          console.log('price freshness + Saturday holdings authority + revision integrity passed');
          NODE
            then ok=1; break; fi
            echo "attempt $attempt failed; waiting before retry"
            sleep $((attempt * 15))
          done
          test "$ok" -eq 1
      - name: Rebase data generation onto latest main
        shell: bash
        run: |
          set -euo pipefail
          START_SHA=$(git rev-parse HEAD)
          git fetch origin main
          LATEST_SHA=$(git rev-parse origin/main)
          if [ "$START_SHA" != "$LATEST_SHA" ]; then
            echo "main moved during market refresh: $START_SHA -> $LATEST_SHA; regenerating from latest main"
            git reset --hard origin/main
            node scripts/fetch-prices.mjs
            git checkout -- holdings.json
            node scripts/fetch-gamma.mjs
            node scripts/fetch-revision-benchmark.mjs
            node scripts/fetch-revision-provenance.mjs
            node scripts/validate-revision-provenance.mjs
            node scripts/audit-revision-integrity.mjs
            node scripts/build-revision-report.mjs
            node scripts/derive-cycle-e.mjs
            node scripts/build-investment-scores.mjs
          fi
      - name: Create protected-main PR when changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILES="prices.json charts.json gamma.json cycle.json revision-benchmark.json scores.json raw/revisions"
          if [ -z "$(git status --porcelain $FILES)" ]; then
            echo "No change in $FILES."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="claude/automation-update-prices-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$BRANCH"
          git add $FILES
          git commit -m "chore: update market data + integrity-audited revisions"
          git push origin "$BRANCH"
          PR_BODY="Automated market-data refresh. holdings.json is deliberately excluded and restored after price fetch so latest Saturday Excel remains authoritative for holdings amounts and weights. Raw provider snapshots are retained and integrity gates validate price/TP/EPS separately. Claude PR Gate validates and squash-merges this protected-main PR."
          for attempt in 1 2 3; do
            if gh pr create --base main --head "$BRANCH" --title "chore: update market data + integrity-audited revisions" --body "$PR_BODY"; then exit 0; fi
            if gh pr view "$BRANCH" --json number,url >/dev/null 2>&1; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          exit 1
