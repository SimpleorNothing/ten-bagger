name: Update stock prices

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-prices.yml'
      - 'index.html'
      - 'scripts/fetch-prices.mjs'
      - 'scripts/fetch-gamma.mjs'
      - 'scripts/fetch-revision-benchmark.mjs'
      - 'scripts/build-investment-scores.mjs'
      - 'scores.json'
      - 'revision-benchmark.json'
      - 'scripts/fetch-revision-provenance.mjs'
      - 'scripts/validate-revision-provenance.mjs'
      - 'scripts/audit-revision-integrity.mjs'
      - 'scripts/build-revision-report.mjs'
  schedule:
    - cron: '5 21 * * *'
    - cron: '35 21 * * *'
    - cron: '52 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch and validate latest prices + sourced revisions (retry ×3)
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3; do
            echo "market refresh attempt $attempt/3"
            if node scripts/fetch-prices.mjs \
              && node scripts/fetch-gamma.mjs \
              && node scripts/fetch-revision-benchmark.mjs \
              && node scripts/build-investment-scores.mjs \
              && node scripts/fetch-revision-provenance.mjs \
              && node scripts/validate-revision-provenance.mjs \
              && node scripts/audit-revision-integrity.mjs \
              && node scripts/build-revision-report.mjs \
              && node scripts/derive-cycle-e.mjs \
              && node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('prices.json', 'utf8'));
          const c = JSON.parse(fs.readFileSync('charts.json', 'utf8'));
          const g = JSON.parse(fs.readFileSync('gamma.json', 'utf8'));
          const rr = JSON.parse(fs.readFileSync('raw/revisions/latest.json', 'utf8'));
          const rb = JSON.parse(fs.readFileSync('revision-benchmark.json', 'utf8'));
          const sc = JSON.parse(fs.readFileSync('scores.json', 'utf8'));
          const now = new Date();
          if (now.getUTCHours() >= 20) {
            const today = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()) / 86400000;
            const asOfDay = String(p.asOf || '').slice(0, 10);
            for (const id of ['gspc', 'ixic', 'us10y']) {
              if (!p.quotes?.[id] || !Number.isFinite(Number(p.quotes[id].price))) throw new Error('required quote missing: ' + id);
              const s = c.series?.[id];
              const last = s?.t?.[s.t.length - 1];
              if (!(Number.isFinite(last) && today - last <= 3)) throw new Error('stale chart for ' + id + ': today ' + today + ', got ' + last);
            }
            if (asOfDay !== now.toISOString().slice(0, 10)) throw new Error('stale prices.asOf: expected ' + now.toISOString().slice(0, 10) + ', got ' + asOfDay);
          }
          if (rb.schema !== 'revision-benchmark-v2' || rb.universe !== 'Nasdaq-100' || !rb.distributions || !rb.ranks) throw new Error('revision benchmark metadata invalid');
          if (sc.schema !== 'investment-scores-v4' || sc.displayedModel !== 'v4') throw new Error('investment score snapshot invalid');
          for (const [tk,row] of Object.entries(sc.rows || {})) {
            if (!row.v3 || !row.v4 || !('delta' in row)) throw new Error('score audit fields missing: '+tk);
          }
          for (const [key,m] of Object.entries(rb.metrics || {})) {
            if (m.n < 50 || !(m.p10 < m.p90)) throw new Error('revision benchmark invalid: '+key);
          }
          if (!g.revisionAudit) throw new Error('revisionAudit missing');
          if (!g.revisionIntegrity) throw new Error('revisionIntegrity missing');
          for (const [tk,e] of Object.entries(g.gamma || {})) {
            if (!e.rev) continue;
            const pr=e.rev.provenance;
            if (!pr?.provider || !pr?.sourceUrl || !pr?.rawRef || !fs.existsSync(pr.rawRef)) throw new Error('unsourced revision survived audit: '+tk);
            if (!e.rev.quality?.fields) throw new Error('semantic quality missing: '+tk);
            if (e.rev.quality.fields.eps !== 'verified' && e.rev.eps) throw new Error('blocked EPS survived scoring gate: '+tk);
          }
          if (!Array.isArray(rr.rows) || !rr.rows.length) throw new Error('revision report rows missing');
          for (const r of rr.rows) {
            for (const k of ['업데이트시점','데이터검증상태','TP소스','EPS소스','주가30일90일소스','원천데이터','EPS기간검증','EPS스코어사용여부']) {
              if (!(k in r) || r[k] === '') throw new Error('revision report audit field missing: '+r.티커+' '+k);
            }
            for (const k of ['TP이전값','TP현재값','EPS현재연도값','EPS다음연도값','EPS다음연도30일전','EPS다음연도90일전']) {
              if (!(k in r)) throw new Error('revision report audit column missing: '+k);
            }
          }
          console.log('price freshness + provenance + semantic integrity + report validation passed');
          NODE
            then ok=1; break; fi
            echo "attempt $attempt failed; waiting before retry"
            sleep $((attempt * 15))
          done
          test "$ok" -eq 1
      - name: Rebase data generation onto latest main
        shell: bash
        run: |
          set -euo pipefail
          START_SHA=$(git rev-parse HEAD)
          git fetch origin main
          LATEST_SHA=$(git rev-parse origin/main)
          if [ "$START_SHA" != "$LATEST_SHA" ]; then
            echo "main moved during market refresh: $START_SHA -> $LATEST_SHA; regenerating from latest main"
            git reset --hard origin/main
            node scripts/fetch-prices.mjs
            node scripts/fetch-gamma.mjs
            node scripts/fetch-revision-benchmark.mjs
            node scripts/build-investment-scores.mjs
            node scripts/fetch-revision-provenance.mjs
            node scripts/validate-revision-provenance.mjs
            node scripts/audit-revision-integrity.mjs
            node scripts/build-revision-report.mjs
            node scripts/derive-cycle-e.mjs
          fi
      - name: Create protected-main PR when changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILES="prices.json charts.json gamma.json cycle.json holdings.json revision-benchmark.json scores.json raw/revisions"
          if [ -z "$(git status --porcelain $FILES)" ]; then
            echo "No change in $FILES."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="claude/automation-update-prices-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$BRANCH"
          git add $FILES
          git commit -m "chore: update market data + integrity-audited revisions"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "chore: update market data + integrity-audited revisions" --body "Automated market-data refresh. Raw provider snapshots are retained, then reproducibility and semantic integrity gates validate price/TP/EPS separately. Ambiguous fiscal-period EPS is excluded from ranking rather than carried forward. raw/revisions/latest.csv and latest.json expose period semantics, before/after values, quality status, and per-field sources. Claude PR Gate validates and squash-merges this protected-main PR."
