name: Update stock prices

on:
  push:
    paths:
      - 'index.html'
      - 'scripts/fetch-prices.mjs'
  schedule:
    - cron: '5 21 * * *'    # 06:05 KST 예약 → 미장 마감 데이터 반영
    - cron: '35 21 * * *'   # 06:35 KST 재시도 → 예약 지연·야후 마감 캔들 지연 방어
    - cron: '52 7 * * *'    # 16:52 KST 예약 → 실측지연 ~98분 → ~18:30 KST 완료 (한국 장마감 15:30 이후)
  workflow_dispatch: {}      # allow manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch and validate latest prices (retry ×3)
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3; do
            echo "price refresh attempt $attempt/3"
            if node scripts/fetch-prices.mjs \
              && node scripts/fetch-gamma.mjs \
              && node scripts/derive-cycle-e.mjs \
              && node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('prices.json', 'utf8'));
          const c = JSON.parse(fs.readFileSync('charts.json', 'utf8'));
          const now = new Date();
          // 한국 장마감(16:52 KST) 실행은 미국 전일 종가가 정상이다.
          // 미국 장 마감 후(20:00 UTC 이후)에는 당일 미국 종가가 반드시 있어야 한다.
          if (now.getUTCHours() >= 20) {
            const expected = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()) / 86400000;
            const asOfDay = String(p.asOf || '').slice(0, 10);
            for (const id of ['gspc', 'ixic', 'us10y']) {
              if (!p.quotes?.[id] || !Number.isFinite(Number(p.quotes[id].price))) {
                throw new Error('required quote missing: ' + id);
              }
              const s = c.series?.[id];
              const last = s?.t?.[s.t.length - 1];
              if (!(Number.isFinite(last) && last >= expected)) {
                throw new Error('stale chart for ' + id + ': expected ' + expected + ', got ' + last);
              }
            }
            if (asOfDay !== now.toISOString().slice(0, 10)) {
              throw new Error('stale prices.asOf: expected ' + now.toISOString().slice(0, 10) + ', got ' + asOfDay);
            }
          }
          console.log('price freshness validation passed');
          NODE
            then ok=1; break; fi
            echo "attempt $attempt failed; waiting before retry"
            sleep $((attempt * 15))
          done
          test "$ok" -eq 1
 
      - name: Commit & push if changed (rebase-safe)
        run: |
          FILES="prices.json charts.json gamma.json cycle.json holdings.json"
          if [ -z "$(git status --porcelain $FILES)" ]; then
            echo "No change in $FILES."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "chore: update stock prices + 1y charts"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main \
               && git push origin HEAD:main; then
              echo "pushed on attempt $i"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "push attempt $i lost the race; backing off"; sleep $(( RANDOM % 6 + 3 ))
          done
          echo "::error::push failed after 5 attempts"; exit 1
