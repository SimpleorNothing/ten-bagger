name: Apply 2026-08-28 official releases once
on:
  push:
    branches: [claude/apply-regular-release-20260828]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[regular-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/apply-regular-release-20260828
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sync confirmed releases across consumers
        run: |
          node <<'NODE'
          const fs=require('fs');
          const cal=JSON.parse(fs.readFileSync('calendar.json','utf8'));
          cal.asOf='2026-08-28T07:30:00+09:00';
          for(const e of cal.events||[]){
            if(e.lbl==='엔비디아 FY27 Q2 실적'){
              e.meta='발표 확인 · NVIDIA 공식 IR 2026-08-26 등록. FY27 Q2 매출 $96.221B(+18% QoQ, +106% YoY), 데이터센터 매출 $89.0B(+18% QoQ, +117% YoY), 비GAAP EPS $2.22. FY27 Q3 매출 가이던스 $108.0B±2%, 비GAAP GM 74.0%±0.5%p. 중국 데이터센터 compute 매출은 Q3 가이던스에 포함하지 않음. · 원문: https://investor.nvidia.com/news/press-release-details/2026/NVIDIA-Announces-Financial-Results-for-Second-Quarter-Fiscal-2027/default.aspx · 확인: 2026-08-28 07:30 KST';
              e.when='08-27 KST (발표 완료 · 매출 $96.2B / DC $89.0B)';
            }
            if(e.lbl==='한국 금통위' && e.d==='2026-08-27'){
              e.meta='발표 확인 · 한국은행 금융통화위원회 2026-08-27 통화정책방향. 기준금리를 2.75%에서 3.00%로 0.25%p 인상. 수출 호조·내수 회복으로 성장세가 예상보다 높고 물가가 상당기간 목표수준을 상회할 것으로 전망해 선제 대응이 필요하다고 판단. 2026년 성장률 전망 3.3%, 2027년 2.9%. · 원문: https://www.bok.or.kr/portal/bbs/P0000559/view.do?menuNo=200690&nttId=11064191 · 등록일: 2026-08-27 · 확인: 2026-08-28 07:30 KST';
              e.when='08-27 KST (발표 완료 · 기준금리 3.00%, +25bp)';
            }
            if(e.lbl==='Marvell FY27 Q2 실적'){
              e.meta='발표 확인 · Marvell 공식 IR 2026-08-27 등록. FY27 Q2 매출 $2.739B(+37% YoY), 데이터센터 매출 $2.172B(+46% YoY, 전체 79%), 비GAAP GM 58.9%, 비GAAP EPS $0.94. AI 관련 bookings가 매우 강해 FY27·FY28 매출 전망을 재차 상향. FY27 Q3 매출 가이던스 $3.150B±5%, 비GAAP EPS $1.10±0.05. · 원문: https://investor.marvell.com/news-events/press-releases/detail/1031/marvell-technology-inc-reports-second-quarter-of-fiscal-year-2027-financial-results · 확인: 2026-08-28 07:30 KST';
              e.when='08-28 KST (발표 완료 · 매출 $2.739B / DC +46% YoY)';
            }
          }
          fs.writeFileSync('calendar.json',JSON.stringify(cal,null,2)+'\n');

          const p=JSON.parse(fs.readFileSync('pulse.json','utf8'));
          p.asOf='2026-08-28T07:30';
          p.headline='한국은행이 기준금리를 3.00%로 25bp 인상한 가운데, 미국 7월 PCE 물가의 높은 수준과 NVIDIA·Marvell의 강한 AI 데이터센터 실적·가이던스가 할인율 리스크와 AI 실수요 강세를 동시에 확인했다.';
          const rates=(p.drivers||[]).find(x=>x.ax==='rates');
          if(rates){
            rates.dir='risk';
            rates.l1='미국 PCE 물가가 높은 가운데 한국은행도 25bp 인상해 글로벌 할인율 부담이 다시 높아졌다.';
            rates.l2='미국 7월 PCE는 전년비 +3.7%, 근원 PCE +3.3%로 높은 수준을 유지했다. 한국은행은 8월 27일 수출 호조·내수 회복과 물가 상방 위험을 근거로 기준금리를 2.75%에서 3.00%로 25bp 인상했다. CPI 둔화만으로 금리 부담 완화를 판단하기보다 PPI·PCE·한국 금리 인상까지 함께 보는 것이 적절하다.';
            rates.verdict='물가 지속성 + 한국 금리 인상 · 할인율 리스크 상향';
            rates.srcs=[
              {t:'BEA Personal Income and Outlays - July 2026',u:'https://www.bea.gov/news/2026/personal-income-and-outlays-july-2026',d:'2026-08-26'},
              {t:'한국은행 통화정책방향 2026.8.27',u:'https://www.bok.or.kr/portal/bbs/P0000559/view.do?menuNo=200690&nttId=11064191',d:'2026-08-27'}
            ];
          }
          const sent=(p.drivers||[]).find(x=>x.ax==='sentiment');
          if(sent){
            sent.dir='neutral';
            sent.l1='NVIDIA와 Marvell의 공식 실적이 AI 데이터센터 수요의 절대 강도를 재확인했지만 금리 상승 환경이 멀티플 확장을 제한한다.';
            sent.l2='NVIDIA FY27 Q2 매출은 $96.2B(+106% YoY), 데이터센터 $89.0B(+117% YoY)였고 Q3 매출 가이던스는 $108.0B±2%다. Marvell FY27 Q2 매출은 $2.739B(+37% YoY), 데이터센터는 +46% YoY였으며 AI bookings 강세를 근거로 FY27·FY28 전망을 재차 상향했다. 실수요는 강하지만 할인율 상승과 밸류에이션 민감도는 별도 리스크다.';
            sent.verdict='AI 실수요 강세 확인 vs 할인율 부담 · 펀더멘털 우위';
            sent.srcs=[
              {t:'NVIDIA FY27 Q2 official results',u:'https://investor.nvidia.com/news/press-release-details/2026/NVIDIA-Announces-Financial-Results-for-Second-Quarter-Fiscal-2027/default.aspx',d:'2026-08-26'},
              {t:'Marvell FY27 Q2 official results',u:'https://investor.marvell.com/news-events/press-releases/detail/1031/marvell-technology-inc-reports-second-quarter-of-fiscal-year-2027-financial-results',d:'2026-08-27'}
            ];
          }
          fs.writeFileSync('pulse.json',JSON.stringify(p,null,2)+'\n');

          let c=fs.readFileSync('changelog.js','utf8');
          c=c.replace("market:'2026-08-27'","market:'2026-08-28'");
          const marker='  var MKT_CHANGELOG=[\n';
          const entry="    {d:'2026-08-28',t:'01 정기 발표 동기화 — 한국은행 기준금리 3.00%(+25bp), NVIDIA FY27 Q2 매출 $96.2B·데이터센터 $89.0B, Marvell FY27 Q2 매출 $2.739B·데이터센터 +46% YoY와 상향 가이던스를 캘린더·시장 맥락·02 기업뉴스·실적 이벤트 상태에 반영'},\n";
          if(!c.includes(entry)) c=c.replace(marker,marker+entry);
          fs.writeFileSync('changelog.js',c);

          if(fs.existsSync('patches/2026-08-28-regular-release-sync.b64')){
            fs.mkdirSync('patches/applied',{recursive:true});
            fs.renameSync('patches/2026-08-28-regular-release-sync.b64','patches/applied/2026-08-28-regular-release-sync.b64');
          }
          NODE
          node -e "JSON.parse(require('fs').readFileSync('calendar.json','utf8'));JSON.parse(require('fs').readFileSync('pulse.json','utf8'));"
          node --check changelog.js
          git diff --check
      - name: Commit data and remove one-time workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/regular-release-apply-20260828.yml
          git add calendar.json pulse.json changelog.js patches
          git commit -m 'data: apply 8/28 official releases [regular-applied]'
          git push origin HEAD:claude/apply-regular-release-20260828
