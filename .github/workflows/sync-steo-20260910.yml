name: Sync EIA September STEO

on:
  push:
    branches:
      - automation/steo-20260910
    paths:
      - scripts/sync-steo-20260910.py
      - .github/workflows/sync-steo-20260910.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/steo-20260910
          fetch-depth: 0
      - name: Apply official release across all consumers
        run: python3 scripts/sync-steo-20260910.py
      - name: Validate synchronized consumers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          s=json.load(open('steo.json',encoding='utf-8'))
          assert s['latest']['ym']=='2026-09' and s['latest']['brent2026']==91 and s['latest']['prevBrent2026']==87
          assert s['series'][-1]['ym']=='2026-09' and s['series'][-1]['brent2026']==91
          c=json.load(open('calendar.json',encoding='utf-8'))
          assert any(e.get('lbl')=='EIA STEO · 2026년 9월' and '$91' in e.get('meta','') for e in c['events'])
          p=json.load(open('pulse.json',encoding='utf-8')); e=next(x for x in p['drivers'] if x['ax']=='energy'); assert '$87→$91/b' in e['l1'] and '4,368BkWh' in e['l1']
          y=json.load(open('cycle.json',encoding='utf-8')); assert y['energyDemand']['electricityGeneration2026']==4368
          r=json.load(open('risk.json',encoding='utf-8')); assert r['latestOfficialEnergy']['brent2026']==91
          g=json.load(open('signal_log.json',encoding='utf-8')); assert any('EIA 2026년 9월 STEO' in x.get('source','') for x in g['log'])
          q=json.load(open('periodic_release_check.json',encoding='utf-8')); assert q['status']=='신규 발표 반영 완료'
          print('all STEO consumers synchronized')
          PY
          grep -Fq 'mkt_eia_steo' trade.js
          grep -Fq "fetch('steo.json" trade.js
          node --check trade.js
          node --check changelog.js
          git diff --check
      - name: Commit synchronized data
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add steo.json trade.js calendar.json pulse.json cycle.json risk.json signal_log.json periodic_release_check.json audit/official-release-checks/2026-09-10.json changelog.js
          if git diff --cached --quiet; then
            echo 'nothing to commit'
            exit 0
          fi
          git commit -m 'data: sync EIA September 2026 STEO across Alpha Map'
          git push origin HEAD:automation/steo-20260910
