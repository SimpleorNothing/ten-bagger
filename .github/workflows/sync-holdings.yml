name: Sync holdings from Drive

# 매주 토요일 자산현황 업데이트 후 자동 동기화(22:00 KST) + Actions 탭 수동 실행.
# 최신 토요일 엑셀을 보유종목·평가금액·보유비중의 단일 기준으로 사용한다.
on:
  schedule:
    - cron: '0 13 * * 6'
  workflow_dispatch: {}
  repository_dispatch:
    types: [drive-holdings-updated]
  push:
    paths:
      - 'scripts/sync-holdings.mjs'
      - 'scripts/reconcile-held-consumers.mjs'
      - '.github/workflows/sync-holdings.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-holdings
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm i googleapis xlsx --no-save
      - name: Build holdings.json from latest 자산현황 Excel
        run: node scripts/sync-holdings.mjs
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
      - name: Normalize Saturday authority metadata
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'holdings.json';
          const h = JSON.parse(fs.readFileSync(p, 'utf8'));
          const wow = String(h.note || '').match(/\(WoW [^)]+\)/)?.[0] || '';
          h.asOf = h.qtyAsOf || h.asOf;
          h.note = `자산현황 ${h.qtyAsOf} 자동 동기화 · 주간 원장 total ${h.total}M${wow ? ' ' + wow : ''}. ` +
            `보유종목·평가금액·보유비중은 최신 토요일 엑셀 고정 권위값이며 평일 시세 갱신은 holdings.json을 변경하지 않는다. ` +
            `레이어=holdings[].w·종목=detail[].w·수량=detail[].qty·평단=avg{}·환율=fx.usdkrw. ※ 괴리율·이벤트 등 편집성 메모는 수동 보강.`;
          fs.writeFileSync(p, JSON.stringify(h, null, 1) + '\n');
          NODE
      - name: Validate latest Saturday Excel authority
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const h = JSON.parse(fs.readFileSync('holdings.json','utf8'));
          const d = String(h.qtyAsOf || '');
          if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) throw new Error('holdings.qtyAsOf missing/invalid: ' + d);
          if (new Date(d + 'T00:00:00Z').getUTCDay() !== 6) throw new Error('holdings source is not Saturday Excel: ' + d);
          if (h.asOf !== d) throw new Error('holdings.asOf must equal Saturday qtyAsOf: ' + h.asOf + ' vs ' + d);
          if (!(Number(h.total) > 0)) throw new Error('holdings.total invalid');
          if (!Array.isArray(h.detail) || !h.detail.length) throw new Error('holdings.detail empty');
          if (/하루 2회 시가 파생|시가평가/.test(String(h.note || ''))) throw new Error('holdings note still claims intraday revaluation authority');
          console.log('Saturday holdings authority verified:', d, 'total=', h.total);
          NODE
      - name: Reconcile all holdings consumers
        run: node scripts/reconcile-held-consumers.mjs
      - name: Create protected-main PR when changed
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
        run: |
          set -euo pipefail
          FILES="holdings.json index.html news_digest.json"
          if [ -z "$(git status --porcelain $FILES)" ]; then
            echo "No holdings consumer changes."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="claude/automation-sync-holdings-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$BRANCH"
          git add $FILES
          git commit -m "chore: sync holdings and reconcile consumers"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "chore: sync holdings and reconcile consumers" --body "Latest Saturday Excel is the authoritative holdings source. This PR reconciles holdings.json, index.html held flags, and news_digest holdings to the same qtyAsOf. Claude PR Gate validates and squash-merges this protected-main PR."
