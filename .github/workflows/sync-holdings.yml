name: Sync holdings from Drive

# 매주 토요일 자산현황 업데이트 후 자동 동기화(22:00 KST) + Actions 탭 수동 실행.
# 최신 토요일 엑셀을 보유종목·평가금액·보유비중의 단일 기준으로 사용한다.
on:
  schedule:
    - cron: '0 13 * * 6'
  workflow_dispatch: {}
  repository_dispatch:
    types: [drive-holdings-updated]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-holdings
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm i googleapis xlsx --no-save
      - name: Build holdings.json from latest 자산현황 Excel
        run: node scripts/sync-holdings.mjs
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
      - name: Validate latest Saturday Excel authority
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const h = JSON.parse(fs.readFileSync('holdings.json','utf8'));
          const d = String(h.qtyAsOf || '');
          if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) throw new Error('holdings.qtyAsOf missing/invalid: ' + d);
          if (new Date(d + 'T00:00:00Z').getUTCDay() !== 6) throw new Error('holdings source is not Saturday Excel: ' + d);
          if (!(Number(h.total) > 0)) throw new Error('holdings.total invalid');
          if (!Array.isArray(h.detail) || !h.detail.length) throw new Error('holdings.detail empty');
          console.log('Saturday holdings authority verified:', d, 'total=', h.total);
          NODE
      - name: Create protected-main PR when changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE="holdings.json"
          if [ -z "$(git status --porcelain "$FILE")" ]; then
            echo "No change in $FILE."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="claude/automation-sync-holdings-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$BRANCH"
          git add "$FILE"
          git commit -m "chore: sync holdings.json from latest Saturday 자산현황"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "chore: sync holdings.json from latest Saturday 자산현황" --body "Latest Saturday Excel is the authoritative holdings source. Claude PR Gate validates qtyAsOf and squash-merges this protected-main PR."
