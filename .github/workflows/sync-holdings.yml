name: Sync holdings from Drive

# 매주 토요일 자산현황 업데이트 후 자동 동기화(22:00 KST) + Actions 탭 수동 실행.
# holdings.json을 OPS §9-2(수동) → §9-1(자동 cron)로 승격.
on:
  schedule:
    - cron: '0 13 * * 6'              # 토 22:00 KST 안전망(유지)
  workflow_dispatch: {}
  repository_dispatch:
    types: [drive-holdings-updated]   # ← Apps Script가 쏘는 이벤트

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-holdings
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm i googleapis xlsx --no-save
      - name: Build holdings.json from 자산현황
        run: node scripts/sync-holdings.mjs
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}   # 서비스계정 JSON 전체
      - name: Commit and push update branch
        id: commit
        run: |
          set -euo pipefail
          FILE="holdings.json"
          if [ -z "$(git status --porcelain "$FILE")" ]; then
            echo "No change in $FILE."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "chore: sync holdings.json from 자산현황 (auto)"
          BRANCH="claude/automation-sync-holdings-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "HEAD:$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open PR and enable auto-merge
        if: steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v7
        env:
          UPDATE_BRANCH: ${{ steps.commit.outputs.branch }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branch = process.env.UPDATE_BRANCH;
            const { owner, repo } = context.repo;
            const pr = await github.rest.pulls.create({
              owner, repo, head: branch, base: 'main',
              title: 'chore: sync holdings.json from 자산현황 (auto)',
              body: 'Automated Drive holdings refresh. This PR is created because main is protected and direct pushes are rejected.',
            });
            try {
              await github.graphql(`
                mutation($id: ID!) {
                  enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: SQUASH}) {
                    pullRequest { number }
                  }
                }`, { id: pr.data.node_id });
              core.info(`auto-merge enabled for PR #${pr.data.number}`);
            } catch (e) {
              core.warning(`auto-merge could not be enabled: ${e.message}`);
              try {
                await github.rest.pulls.merge({ owner, repo, pull_number: pr.data.number, merge_method: 'squash' });
              } catch (mergeError) {
                core.warning(`PR #${pr.data.number} remains open for required checks: ${mergeError.message}`);
              }
            }
