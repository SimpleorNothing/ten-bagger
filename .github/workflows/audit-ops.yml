name: Daily OPS audit

on:
  schedule:
    - cron: '30 0 * * *' # 09:30 KST 매일
  workflow_dispatch: {}
  push:
    paths:
      - 'OPS.md'
      - 'STYLE_GUIDE.md'
      - 'scripts/audit-ops.mjs'
      - 'scripts/patch-ops-revision-cadence-once.mjs'
      - 'prices.json'
      - 'charts.json'
      - 'signals.json'
      - 'gamma.json'
      - 'cycle.json'
      - 'index.html'
      - 'changelog.js'
      - '.github/workflows/audit-ops.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Materialize one-time OPS cadence documentation
        if: github.ref_name == 'claude/ops-revision-cadence-20260816'
        run: |
          node scripts/patch-ops-revision-cadence-once.mjs
          if [ -n "$(git status --porcelain OPS.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add OPS.md
            git commit -m "docs: document revision ranking cadence"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Run OPS compliance audit
        run: node scripts/audit-ops.mjs