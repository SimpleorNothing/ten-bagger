name: Weekly allocation review

on:
  schedule:
    - cron: '10 0 * * 6' # 09:10 KST Saturday
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-allocation-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate allocation review
        run: node scripts/update-allocation-review.mjs
      - name: Validate JSON
        run: node -e "JSON.parse(require('fs').readFileSync('allocation-review.json','utf8')); console.log('allocation-review.json OK')"
      - name: Open protected-main PR if changed
        env:
          # User PAT is required so pull_request workflows actually fire.
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
        run: |
          set -euo pipefail
          FILE="allocation-review.json"
          if [ -z "$(git status --porcelain "$FILE")" ]; then echo "No allocation review change."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="claude/automation-weekly-allocation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$BRANCH"
          git add "$FILE"
          git commit -m "chore: refresh weekly allocation review"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "chore: refresh weekly allocation review" --body "Automated weekly allocation review refresh. Claude PR Gate validates and merges this branch."
