name: Apply zero-base investment score

on:
  workflow_dispatch:
  push:
    branches:
      - feat/zero-base-investment-score
    paths:
      - .github/workflows/apply-zero-base-investment-score.yml
      - scripts/apply_zero_base_investment_score.py
      - scripts/fix_zero_base_injection.py
      - scripts/apply_dual_rank_ui.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/zero-base-investment-score
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source update
        run: |
          python scripts/apply_zero_base_investment_score.py
          python scripts/fix_zero_base_injection.py
          python scripts/apply_dual_rank_ui.py
      - name: Validate
        run: |
          git diff --check
      - name: Commit source update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index.html changes"
            exit 0
          fi
          git commit -m "feat: show zero-base and portfolio-adjusted priority"
          git push origin HEAD:feat/zero-base-investment-score
