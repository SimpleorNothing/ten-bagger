name: Fix NFP integrity once

# Trigger commit: 2026-08-08 NFP official-value consistency repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-nfp-integrity.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply NFP source-of-truth fix
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "   (bk.levels||[]).concat(live).forEach(function(x){if(Array.isArray(x)&&x[0]&&x[1]!=null&&isFinite(x[1]))merged[x[0]]=[x[0],+x[1]];});"
          new = "   // 정기 발표 직후에는 nfp.json(BLS 공식값)을 최종 SoT로 사용한다.\n   // FRED는 장기 이력 보강용이며 같은 월의 값은 BLS 공식 백필이 덮어쓴다.\n   live.concat(bk.levels||[]).forEach(function(x){if(Array.isArray(x)&&x[0]&&x[1]!=null&&isFinite(x[1]))merged[x[0]]=[x[0],+x[1]];});"
          if old not in s:
              raise SystemExit('NFP renderer target not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('changelog.js')
          s = p.read_text(encoding='utf-8')
          old = "    market:'2026-08-03', insight:'2026-08-03', council:'2026-08-05',"
          new = "    market:'2026-08-08', insight:'2026-08-03', council:'2026-08-05',"
          if old in s:
              s = s.replace(old, new, 1)
          marker = "  var MKT_CHANGELOG=[\n"
          entry = "    {d:'2026-08-08',t:'01 미국 비농업고용(NFP) 7월 -23K·5월 +63K·6월 +20K 공식 수정치를 반영하고, BLS 공식 백필을 FRED 지연값보다 우선하도록 정합성 경로 수정'},\n"
          if entry not in s:
              if marker not in s:
                  raise SystemExit('changelog marker not found')
              s = s.replace(marker, marker + entry, 1)
          p.write_text(s, encoding='utf-8')
          PY

          mkdir -p patches/applied
          for f in patches/2026-08-08-nfp-integrity.b64 patches/2026-08-08-nfp-integrity-v2.b64 patches/2026-08-08-nfp-integrity-v3.b64; do
            if [ -f "$f" ]; then git mv "$f" patches/applied/; fi
          done

      - name: Validate NFP values and syntax
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const n=JSON.parse(fs.readFileSync('nfp.json','utf8'));
          const m=Object.fromEntries(n.levels);
          const d=(a,b)=>m[b]-m[a];
          if(d('2026-04-01','2026-05-01')!==63) throw new Error('May NFP mismatch');
          if(d('2026-05-01','2026-06-01')!==20) throw new Error('June NFP mismatch');
          if(d('2026-06-01','2026-07-01')!==-23) throw new Error('July NFP mismatch');
          const html=fs.readFileSync('index.html','utf8');
          if(!html.includes('live.concat(bk.levels||[])')) throw new Error('BLS priority renderer missing');
          if(html.includes('(bk.levels||[]).concat(live).forEach')) throw new Error('stale FRED priority renderer remains');
          console.log('NFP integrity: May +63K, June +20K, July -23K; BLS priority OK');
          NODE
          node -e 'const fs=require("fs");const s=fs.readFileSync("index.html","utf8");const m=[...s.matchAll(/<script>([\s\S]*?)<\/script>/g)];m.forEach((x,i)=>fs.writeFileSync("/tmp/nfp-s"+i+".js",x[1]));console.log("script blocks:",m.length);'
          for f in /tmp/nfp-s*.js; do node --check "$f"; done
          node --check changelog.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make BLS official NFP the render source of truth"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1

      - name: Deploy
        run: |
          npm install -g wrangler@4
          wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
