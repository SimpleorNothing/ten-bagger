name: Wire capital scarcity monitor

on:
  push:
    branches:
      - agent/add-capital-scarcity-monitor

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-capital-scarcity-monitor
          fetch-depth: 0
      - name: Inject monitor script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="capital-scarcity.js" defer></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
              p.write_text(s)
          PY
      - name: Commit wiring if changed
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: show AI capital scarcity monitor"
          git push origin HEAD:agent/add-capital-scarcity-monitor
