name: Sync China August trade 2026-09-09
on:
  push:
    branches: [automation/china-trade-20260909]
    paths:
      - '.github/workflows/sync-china-trade-20260909.yml'
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/china-trade-20260909
          fetch-depth: 0
      - name: Apply official China August trade release
        run: |
          python3 - <<'PY'
          import json, pathlib, time
          from datetime import datetime, timezone, timedelta
          root=pathlib.Path('.')
          KST=timezone(timedelta(hours=9))
          now=datetime.now(KST).replace(microsecond=0)
          stamp=now.strftime('%Y-%m-%d %H:%M KST')
          iso=now.isoformat()
          gov='https://english.www.gov.cn/archive/statistics/202609/08/content_WS6a9fb46bc6d00ca5f9a0d102.html'
          customs='https://online.customs.gov.cn/'

          china={
            'asOf':'2026-09-08',
            'registeredAt':'2026-09-08',
            'checkedAt':iso,
            'source':'General Administration of Customs of China (official data; State Council official dissemination)',
            'sourceUrl':gov,
            'customsPortal':customs,
            'unit':'USD billion / YoY %',
            'metric':'exports, imports, trade balance',
            'note':'Only confirmed released values are stored. July comparison values are from the same customs data series as cited by the official-release reporting; no forecast values are stored.',
            'series':[
              {'ym':'2026-07','expYoy':23.9,'impYoy':27.5,'balance':112.50},
              {'ym':'2026-08','exports':401.44,'imports':282.36,'expYoy':25.0,'impYoy':28.2,'balance':119.09}
            ],
            'latest':{'ym':'2026-08','exports':401.44,'imports':282.36,'expYoy':25.0,'impYoy':28.2,'balance':119.09,'prevExpYoy':23.9,'prevImpYoy':27.5,'prevBalance':112.50}
          }
          (root/'china_trade.json').write_text(json.dumps(china,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # 01 market monitoring: add dedicated card to existing trade.js loader.
          p=root/'trade.js'; s=p.read_text(encoding='utf-8')
          if 'mkt_china_trade' not in s:
            insert=r'''
  function mountChinaTrade() {
    var id = 'mkt_china_trade';
    if (document.getElementById(id)) return true;
    var grid = document.getElementById('mktIndicators');
    if (!grid) return false;
    var card = document.createElement('div');
    card.className = 'mkt-card'; card.id = id;
    card.setAttribute('data-indicator-key', 'china-trade');
    card.innerHTML = '<div class="mkt-ph">중국 수출입 로딩…</div>';
    grid.appendChild(card);
    fetch('china_trade.json?t=' + Date.now(), { cache: 'no-store' }).then(function(r){ return r.ok ? r.json() : null; }).then(function(j){
      if(!j || !j.latest || !j.series || !j.series.length){ card.innerHTML='<div class="mkt-ph">발표 대기 · 중국 해관총서 월간 수출입</div>'; return; }
      var z=j.latest, vals=j.series.map(function(x){return x.expYoy;});
      var expDir=z.expYoy>=z.prevExpYoy, impDir=z.impYoy>=z.prevImpYoy;
      card.innerHTML='<div class="mkt-nm">중국 수출입</div><div class="mkt-val">수출 +'+z.expYoy.toFixed(1)+'%</div>'+
        '<div class="mkt-chg '+(expDir?'up':'dn')+'">수입 +'+z.impYoy.toFixed(1)+'% YoY <span style="font:600 12px var(--mono);margin-left:8px;color:var(--faint)">흑자 $'+z.balance.toFixed(2)+'B</span></div>'+
        lensRow('<b>글로벌 상품수요</b> '+(expDir&&impDir?'<span class="ok">개선</span>':'<span class="nt">혼조</span>'),
          '수출 '+z.prevExpYoy.toFixed(1)+'%→'+z.expYoy.toFixed(1)+'% · 수입 '+z.prevImpYoy.toFixed(1)+'%→'+z.impYoy.toFixed(1)+'% · 무역흑자 $'+z.prevBalance.toFixed(2)+'B→$'+z.balance.toFixed(2)+'B')+
        '<div class="mkt-chart">'+spark(vals,expDir)+'</div><div class="mkt-span">'+esc(z.ym)+' · 중국 해관총서 · 등록 2026-09-08</div>';
    }).catch(function(){ card.innerHTML='<div class="mkt-ph">중국 해관총서 데이터 로딩 실패</div>'; });
    return true;
  }
'''
            marker='\n  function boot() {\n'
            if marker not in s: raise SystemExit('trade.js boot marker not found')
            s=s.replace(marker,'\n'+insert+marker,1)
            s=s.replace('    mount(); mountGlobalSemi();','    mount(); mountGlobalSemi(); mountChinaTrade();',1)
            s=s.replace('var a=mount(), b=mountGlobalSemi(); if ((a && b) || ++n > 40)','var a=mount(), b=mountGlobalSemi(), c=mountChinaTrade(); if ((a && b && c) || ++n > 40)',1)
            p.write_text(s,encoding='utf-8')

          # Calendar result: upsert rather than duplicate.
          p=root/'calendar.json'; cal=json.loads(p.read_text(encoding='utf-8'))
          ev={
            'd':'2026-09-08','cat':'macro','lbl':'중국 수출입 · 2026년 8월',
            'meta':f'발표 확인 · 중국 해관총서 2026-09-08 공개 데이터. 달러 기준 수출 +25.0% YoY(7월 +23.9%), 수입 +28.2%(7월 +27.5%), 무역흑자 $119.09B(7월 $112.50B). 8월 수출 $401.44B, 수입 $282.36B. 위안화 기준 8월 총교역은 4.65조위안(+19.8% YoY), 수출 +18.6%, 수입 +21.7%. 예측값 미사용. · 공식 배포: {gov} · 해관총서 포털: {customs} · 등록일: 2026-09-08 · 확인: {stamp}',
            'when':'09-08 KST (발표 완료 · 수출 +25.0% / 수입 +28.2% YoY)'
          }
          events=cal.setdefault('events',[])
          events[:]=[x for x in events if x.get('lbl')!='중국 수출입 · 2026년 8월']
          events.append(ev); events.sort(key=lambda x:(x.get('d','9999-99-99'),x.get('when',''),x.get('lbl','')))
          cal['asOf']=iso
          p.write_text(json.dumps(cal,ensure_ascii=False,indent=1)+'\n',encoding='utf-8')

          # Market context used by 01 and council/brief consumers.
          p=root/'pulse.json'; pulse=json.loads(p.read_text(encoding='utf-8'))
          pulse['asOf']=now.strftime('%Y-%m-%dT%H:%M')
          flow=next((x for x in pulse.get('drivers',[]) if x.get('ax')=='flow'),None)
          if flow:
            flow['l1']='중국 8월 수출 +25.0%·수입 +28.2% YoY와 무역흑자 $119.09B가 한국 8월 반도체 수출, SIA/WSTS 7월 글로벌 반도체 판매 강세와 함께 글로벌 상품·AI 인프라 수요의 우호적 배경을 확인했다.'
            flow['l2']='중국 전체 무역은 반도체 전용 지표가 아니므로 AI 수요를 직접 추정하지 않는다. 다만 수출·수입 증가율이 모두 7월보다 높아지고, 한국 반도체 수출·SIA/WSTS·AVGO·CRDO 공식 실적과 방향이 겹친다는 점을 보조 수요 신호로 사용한다.'
            flow['verdict']='중국 무역 동반 가속 · 글로벌 상품수요 보조 신호 강화'
            srcs=flow.setdefault('srcs',[])
            srcs=[x for x in srcs if '중국 해관총서' not in x.get('t','')]
            srcs.insert(0,{'t':'중국 해관총서 · 2026년 8월 수출입','u':gov,'d':'2026-09-08'})
            flow['srcs']=srcs
          pulse['headline']='중국 8월 수출 +25.0%·수입 +28.2% YoY로 글로벌 상품수요가 추가 개선됐다. 한국 반도체 수출·SIA/WSTS·AVGO·CRDO 실적과 방향은 일치하지만, 중국 전체 무역을 AI 수요로 직접 등치하지 않는다. 미국 8월 NFP +162K와 FedWatch 금리 불확실성, Micron 대만 노사·Tesla 규제 리스크는 기존 관찰을 유지한다.'
          p.write_text(json.dumps(pulse,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Semi-cycle demand cluster: supporting, explicitly non-semiconductor-specific.
          p=root/'cycle.json'; cyc=json.loads(p.read_text(encoding='utf-8'))
          cyc['asOf']='2026-09-09'
          d=next((x for x in cyc.get('clusters',[]) if x.get('id')=='D'),None)
          if d:
            note='중국 해관총서 8월 무역: 달러 기준 수출 +25.0%·수입 +28.2% YoY, 모두 7월보다 가속. 반도체 전용 데이터가 아니므로 보조 글로벌 수요 신호로만 사용.'
            hist=[x for x in d.setdefault('history',[]) if x.get('date')!='2026-09-09']
            hist.insert(0,{'date':'2026-09-09','note':note}); d['history']=hist
            d['updated']='2026-09-09'
            if '중국 8월 무역' not in d.get('now',''):
              d['now']=d.get('now','')+' · 중국 8월 무역 수출 +25.0%·수입 +28.2% YoY(보조 수요 신호)'
          p.write_text(json.dumps(cyc,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')

          # Risk board: ③ export-sensitive channel gets contextual corroboration without changing state.
          p=root/'risk.json'; risk=json.loads(p.read_text(encoding='utf-8'))
          risk['asOf']='2026-09-09'
          r3=next((x for x in risk.get('items',[]) if x.get('no')=='③'),None)
          if r3:
            add=' 중국 8월 달러 기준 수출 +25.0%·수입 +28.2%로 7월보다 동반 가속해 아시아 교역 급랭 리스크를 낮추는 보조 신호가 추가됐다. 중국 전체 무역을 반도체 수요로 직접 환산하지는 않는다.'
            if '중국 8월 달러 기준' not in r3.get('verdict',''): r3['verdict']=r3.get('verdict','')+add
            srcs=r3.setdefault('srcs',[])
            if not any('중국 해관총서' in x.get('label','') for x in srcs): srcs.append({'label':'중국 해관총서 — 2026년 8월 수출입(2026-09-08)','url':gov})
            r3['upd']='2026-09-09'
          p.write_text(json.dumps(risk,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # 02/04 shared context: signal log is consumed by council-context.js along with pulse/cycle/risk/calendar.
          p=root/'signal_log.json'; sig=json.loads(p.read_text(encoding='utf-8'))
          sig['asOf']='2026-09-09'
          log=sig.setdefault('log',[])
          log[:]=[x for x in log if x.get('source')!='중국 해관총서 2026년 8월 수출입 공식 발표']
          log.append({
            'date':'2026-09-08','at':iso,'source':'중국 해관총서 2026년 8월 수출입 공식 발표',
            'srcs':[{'label':'General Administration of Customs data · State Council official dissemination','url':gov}],
            'items':[{'tag':'매크로·중국 수요','layer':'L2','col':'#0ca678','html':'<b>[09-08] 중국 8월 달러 기준 수출 +25.0% YoY(7월 +23.9%), 수입 +28.2%(+27.5%), 무역흑자 $119.09B($112.50B)로 동반 가속.</b> 글로벌 상품수요의 보조 강세 신호. 한국 반도체 수출·SIA/WSTS·AVGO·CRDO 실적과 방향은 일치하지만 중국 전체 무역은 반도체/AI 전용 지표가 아니므로 <b>AI 수요로 직접 환산하지 않음</b>. 단계·보유비중·숫자 파일 불변.'}]
          })
          log.sort(key=lambda x:(x.get('date',''),x.get('at','')))
          p.write_text(json.dumps(sig,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Audit trail / daily run status.
          audit={
            'date':'2026-09-09','checkedAt':iso,'status':'신규 발표 반영 완료',
            'newOfficialReleases':[{'indicator':'중국 해관총서 8월 수출입','releaseDate':'2026-09-08','sourceUrl':gov,'values':china['latest']}],
            'pending':[{'indicator':'EIA STEO 2026년 9월','status':'발표 대기','scheduled':'2026-09-09 12:00~12:15 ET / 2026-09-10 01:00~01:15 KST'},{'indicator':'BLS PPI 2026년 8월','status':'발표 대기','scheduled':'2026-09-10 08:30 ET / 2026-09-10 21:30 KST'}],
            'consumers':['01 중국 수출입 카드','china_trade.json 시계열','calendar.json','pulse.json','cycle.json 수요 선행','risk.json ③','signal_log.json (02·04 공유 컨텍스트)','changelog.js'],
            'liveVerification':'pending until main merge/deploy'
          }
          (root/'periodic_release_check.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=root/'changelog.js'; ch=p.read_text(encoding='utf-8')
          marker='  var MKT_CHANGELOG=[\n'
          entry="    {d:'2026-09-09',t:'01~06 정기 발표 동기화 — 중국 해관총서 8월 무역(수출 +25.0%·수입 +28.2% YoY, 흑자 $119.09B)을 01 카드·시계열·캘린더·시장맥락·사이클·리스크·02/04 공유 signal_log에 공식값으로 동기화'},\n"
          if entry not in ch:
            if marker not in ch: raise SystemExit('changelog marker not found')
            ch=ch.replace(marker,marker+entry,1)
            p.write_text(ch,encoding='utf-8')
          PY
      - name: Validate all consumers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          for f in ['china_trade.json','calendar.json','pulse.json','cycle.json','risk.json','signal_log.json','periodic_release_check.json']:
              json.load(open(f,encoding='utf-8'))
          z=json.load(open('china_trade.json'))['latest']
          assert z['ym']=='2026-08' and z['expYoy']==25.0 and z['impYoy']==28.2 and z['balance']==119.09
          cal=json.load(open('calendar.json')); txt=json.dumps(cal,ensure_ascii=False)
          assert '중국 수출입 · 2026년 8월' in txt and '$119.09B' in txt
          p=json.load(open('pulse.json')); f=next(x for x in p['drivers'] if x['ax']=='flow'); assert '+25.0%' in f['l1'] and '+28.2%' in f['l1']
          c=json.load(open('cycle.json')); d=next(x for x in c['clusters'] if x['id']=='D'); assert '중국 8월 무역' in d['now']
          r=json.load(open('risk.json')); r3=next(x for x in r['items'] if x['no']=='③'); assert '중국 8월 달러 기준' in r3['verdict']
          s=json.load(open('signal_log.json')); assert any(x.get('source')=='중국 해관총서 2026년 8월 수출입 공식 발표' for x in s['log'])
          PY
          grep -Fq 'mkt_china_trade' trade.js
          grep -Fq 'china_trade.json' trade.js
          node --check trade.js
          node --check changelog.js
          git diff --check
      - name: Commit synced consumers and open PR
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add china_trade.json trade.js calendar.json pulse.json cycle.json risk.json signal_log.json periodic_release_check.json changelog.js
          git commit -m 'data: sync China August trade across Alpha Map consumers'
          git push origin HEAD:automation/china-trade-20260909
          gh pr create --base main --head automation/china-trade-20260909 --title 'data: sync China August trade across Alpha Map consumers' --body '중국 해관총서 2026년 8월 수출입 공식 발표를 01 카드/시계열, calendar, pulse, cycle, risk, 02·04 공유 signal_log, 변경 이력에 동기화합니다. 추정값은 사용하지 않습니다.'
