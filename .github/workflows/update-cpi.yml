name: Update global CPI

on:
  schedule:
    - cron: '35 22 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-cpi.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-cpi
  cancel-in-progress: false

jobs:
  cpi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch latest CPI series
        run: node scripts/fetch-cpi.mjs
      - name: Sync official US CPI release across consumers
        run: node scripts/sync-us-cpi-release.mjs
      - name: Create protected-main PR if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILES="cpi.json calendar.json pulse.json changelog.js"
          if [ -z "$(git status --porcelain $FILES)" ]; then
            echo "No CPI changes."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="claude/automation-update-cpi-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$BRANCH"
          git add $FILES
          git commit -m "chore: sync official CPI release"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "chore: sync official CPI release" --body "BLS 공식 CPI 발표를 CPI 시계열, 01 캘린더, 시장 맥락, 변경 이력에 동기화합니다. Claude PR Gate가 검증 후 squash merge합니다."
