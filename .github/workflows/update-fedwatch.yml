name: Update FedWatch December 2026
on:
  schedule:
    - cron: '15 22 * * *'
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/update-fedwatch.yml'
      - 'scripts/fetch-fedwatch.py'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: update-fedwatch-dec26
  cancel-in-progress: false
jobs:
  fedwatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyFedWatch dependencies
        run: pip install --disable-pip-version-check pyfedwatch==1.2.0 pandas pandas-datareader requests beautifulsoup4
      - name: Compute December 2026 probabilities with PyFedWatch
        run: python3 scripts/fetch-fedwatch.py
      - name: Validate and push automation branch when changed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open('fedwatch.json'))
          checks=d.get('checks') or []
          assert checks and checks[-1].get('date') and checks[-1].get('status') in ('확인','확인 필요')
          assert d.get('methodology') == 'ARahimiQuant/pyfedwatch 1.2.0'
          if checks[-1]['status']=='확인':
              h=d.get('history') or []
              assert h and h[-1].get('date')==checks[-1].get('date') and len(h[-1].get('ranges') or []) >= 2
              total=sum(float(x.get('probability',0)) for x in h[-1]['ranges'])
              assert 98 <= total <= 102, total
          PY
          if [ -z "$(git status --porcelain fedwatch.json)" ]; then echo "No FedWatch change."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fedwatch.json
          git commit -m "chore: update December 2026 FedWatch via pyfedwatch"
          BRANCH="claude/automation-update-fedwatch-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "HEAD:$BRANCH"
