name: Update FedWatch December 2026
on:
  schedule:
    # Investing.com typically publishes the refreshed US-session snapshot around
    # 02:00~03:30 EDT. Run after that window so the daily site does not remain on
    # the previous source date through the Korean afternoon.
    - cron: '30 7 * * *'
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/update-fedwatch.yml'
      - 'scripts/fetch-fedwatch.py'
      - 'scripts/fetch-fedwatch-authoritative.py'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: update-fedwatch-dec26
  cancel-in-progress: false
jobs:
  fedwatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FedWatch dependencies
        run: pip install --disable-pip-version-check requests beautifulsoup4 pyfedwatch==1.2.0 'pandas<3' pandas-datareader==0.10.0
      - name: Fetch December 2026 FedWatch with source priority
        run: python3 scripts/fetch-fedwatch-authoritative.py
        env:
          CME_FEDWATCH_TOKEN: ${{ secrets.CME_FEDWATCH_TOKEN }}
      - name: Validate and push automation branch when changed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open('fedwatch.json'))
          checks=d.get('checks') or []
          assert checks and checks[-1].get('date') and str(checks[-1].get('status','')).startswith(('확인','확인 필요'))
          if str(checks[-1]['status']).startswith('확인됨') or checks[-1]['status']=='확인':
              assert d.get('source') in ('CME FedWatch End-of-Day API','Investing.com Fed Rate Monitor','PyFedWatch methodology')
              h=d.get('history') or []
              assert h and (h[-1].get('sourceDate') or h[-1].get('date'))==checks[-1].get('sourceDate')
              total=sum(float(x.get('probability',0)) for x in h[-1].get('ranges') or [])
              assert 98 <= total <= 102, total
              assert d.get('asOf')==(h[-1].get('sourceDate') or h[-1].get('date'))
          p=json.load(open('pulse.json'))
          assert 'FedWatch' in p.get('headline','')
          PY
          FILES="fedwatch.json pulse.json changelog.js"
          if [ -z "$(git status --porcelain $FILES)" ]; then echo "No FedWatch change."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "chore: update December 2026 FedWatch"
          BRANCH="claude/automation-update-fedwatch-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "HEAD:$BRANCH"
