name: Update FedWatch December 2026
on:
  schedule:
    - cron: '15 22 * * *'
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/update-fedwatch.yml'
      - 'scripts/fetch-fedwatch.py'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: update-fedwatch-dec26
  cancel-in-progress: false
jobs:
  fedwatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyFedWatch dependencies
        run: pip install --disable-pip-version-check pyfedwatch==1.2.0 pandas pandas-datareader requests beautifulsoup4
      - name: Compute December 2026 probabilities with PyFedWatch
        run: python3 scripts/fetch-fedwatch.py
      - id: commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open('fedwatch.json'))
          checks=d.get('checks') or []
          assert checks and checks[-1].get('date') and checks[-1].get('status') in ('확인','확인 필요')
          assert d.get('methodology') == 'ARahimiQuant/pyfedwatch 1.2.0'
          if checks[-1]['status']=='확인':
              h=d.get('history') or []
              assert h and h[-1].get('date')==checks[-1].get('date') and len(h[-1].get('ranges') or []) >= 2
              total=sum(float(x.get('probability',0)) for x in h[-1]['ranges'])
              assert 98 <= total <= 102, total
          PY
          if [ -z "$(git status --porcelain fedwatch.json)" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fedwatch.json && git commit -m "chore: update December 2026 FedWatch via pyfedwatch"
          BRANCH="automation/update-fedwatch-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git push origin "HEAD:$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - if: steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v7
        env:
          UPDATE_BRANCH: "${{ steps.commit.outputs.branch }}"
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          script: |
            const { owner, repo } = context.repo;
            const pr = await github.rest.pulls.create({owner,repo,head:process.env.UPDATE_BRANCH,base:'main',title:'chore: update December 2026 FedWatch via pyfedwatch',body:'Automated PyFedWatch daily check. Uses Federal Reserve FOMC calendar, FRED target range, and Fed Funds futures price input. If any required input cannot be verified, it records 확인 필요 instead of presenting stale probabilities as current.'});
            try {
              await github.graphql('mutation($id:ID!){enablePullRequestAutoMerge(input:{pullRequestId:$id,mergeMethod:SQUASH}){pullRequest{number}}}',{id:pr.data.node_id});
              core.info(`auto-merge enabled for PR #${pr.data.number}`);
            } catch (e) {
              core.warning(`auto-merge deferred for PR #${pr.data.number}: ${e.message}`);
            }
