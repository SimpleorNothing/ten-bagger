name: Apply prompt cache optimization

on:
  push:
    branches:
      - claude/prompt-cache-optimization
    paths:
      - .github/workflows/apply-prompt-cache-optimization.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/prompt-cache-optimization
          fetch-depth: 0

      - name: Apply Anthropic prompt caching
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('worker.js')
          s = p.read_text(encoding='utf-8')

          marker = '// Anthropic 오류 응답을 상태코드별 조치 안내가 붙은 한국어 메시지로 변환.'
          helper = '''// Anthropic prompt caching — 반복되는 system prefix를 5분 ephemeral cache로 재사용한다.\n// 고정 지시문만 캐시하고 사용자 입력·라이브 데이터는 캐시 블록 밖에 둔다.\nfunction cacheableSystem(text) {\n  return [{ type: "text", text, cache_control: { type: "ephemeral" } }];\n}\n\n'''
          if 'function cacheableSystem(text)' not in s:
              if marker not in s:
                  raise SystemExit('insert marker not found')
              s = s.replace(marker, helper + marker, 1)

          before = s.count('system: sys')
          if before < 6:
              raise SystemExit(f'expected >=6 system: sys occurrences, found {before}')
          s = s.replace('system: sys', 'system: cacheableSystem(sys)')

          needle = '''  const payload = {\n    model: "claude-sonnet-5",\n    max_tokens: maxTokens || 4000,\n    stream: true,\n    messages: [{ role: "user", content: prompt }],\n  };'''
          repl = needle + '''\n  // 같은 긴 요청의 자동 복구 재호출은 prefix가 동일하므로 cache hit를 활용한다.\n  // 일반 단발 요청에서도 Anthropic이 cacheable prefix를 자동 탐색한다.\n  payload.cache_control = { type: "ephemeral" };'''
          if 'payload.cache_control = { type: "ephemeral" };' not in s:
              if needle not in s:
                  raise SystemExit('anthropicText payload marker not found')
              s = s.replace(needle, repl, 1)

          p.write_text(s, encoding='utf-8')
          print(f'cached system call sites: {before}')
          PY

      - name: Validate worker syntax
        run: node --check worker.js

      - name: Remove one-off workflow and commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-prompt-cache-optimization.yml
          git add worker.js
          git commit -m "perf: enable Anthropic prompt caching"
          git push origin HEAD:claude/prompt-cache-optimization
