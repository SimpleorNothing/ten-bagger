name: Apply index.html patch

on:
  push:
    branches: [main]
    paths: ['patches/*.b64']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: apply-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply new patches
        run: |
          set -e
          mkdir -p patches/applied
          CHANGED=$(git diff --name-only HEAD^ HEAD -- 'patches/*.b64' ':(exclude)patches/applied/*' 2>/dev/null || true)
          FALLBACK=0
          if [ -z "$CHANGED" ]; then CHANGED=$(ls patches/*.b64 2>/dev/null || true); FALLBACK=1; fi
          if [ -z "$CHANGED" ]; then echo "no new patch"; exit 0; fi
          for B in $CHANGED; do
            case "$B" in patches/applied/*) continue;; esac
            [ -f "$B" ] || continue
            base64 -d "$B" > /tmp/p.patch
            if ! git apply --check /tmp/p.patch 2>/dev/null; then
              if [ "$FALLBACK" = "1" ]; then
                git mv "$B" "patches/applied/$(basename "$B")"
                continue
              fi
              echo "::error::patch does not apply: $B"; exit 1
            fi
            git apply /tmp/p.patch
            git mv "$B" "patches/applied/$(basename "$B")"
          done
      - name: Validate inline script syntax
        run: |
          node -e 'const fs=require("fs");const s=fs.readFileSync("index.html","utf8");const m=[...s.matchAll(/<script>([\s\S]*?)<\/script>/g)];m.forEach((x,i)=>fs.writeFileSync("/tmp/s"+i+".js",x[1]));console.log("script blocks:",m.length);'
          for f in /tmp/s*.js; do node --check "$f"; done
      - name: Commit to automation branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "chore: apply index.html patch via patches/*.b64"
          BRANCH="claude/automation-apply-patch-${GITHUB_RUN_ID}"
          git push origin "HEAD:$BRANCH"
