name: Periodic release sync 2026-09-11
on:
  push:
    branches:
      - automation/periodic-release-20260911
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/periodic-release-20260911
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply official release sync
        run: python scripts/sync-periodic-20260911.py
      - name: Validate consumers
        run: |
          python -m json.tool ppi.json >/dev/null
          python -m json.tool eia_weekly.json >/dev/null
          python -m json.tool calendar.json >/dev/null
          python -m json.tool pulse.json >/dev/null
          python -m json.tool cycle.json >/dev/null
          python -m json.tool risk.json >/dev/null
          python -m json.tool signal_log.json >/dev/null
          grep -q 'function mountPpi()' trade.js
          grep -q 'function mountEiaWeekly()' trade.js
          grep -q '"headlineMom": 0.4' ppi.json
          grep -q '"commercialCrudeMb": 424.069' eia_weekly.json
      - name: Commit synchronized releases
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ppi.json eia_weekly.json calendar.json pulse.json cycle.json risk.json signal_log.json trade.js periodic_release_check.json audit/official-release-checks/2026-09-11.json changelog.js
          git diff --cached --quiet || git commit -m 'data: sync Aug PPI and Sep 4 EIA WPSR [periodic-sync]'
          git push origin HEAD:automation/periodic-release-20260911
