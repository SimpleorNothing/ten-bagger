name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    paths-ignore:
      - 'prices.json'        # 시세 크론 커밋은 배포 불필요
      - 'news.json'          # 뉴스 크론 커밋은 배포 불필요(리포 전용)
      - 'signal_drafts.json' # 트리아지 후보 커밋은 배포 불필요(검토용)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: wrangler deploy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler v4
        run: npm install -g wrangler@4

      - name: Deploy
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for attempt in 1 2 3; do
            if wrangler deploy --var DEPLOY_SHA:"${GITHUB_SHA}" --var DEPLOYED_AT:"${DEPLOYED_AT}"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Cloudflare API 일시 오류로 배포 재시도 ($attempt/3)"
            sleep $((attempt * 10))
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployed SHA on Workers and custom domain
        shell: bash
        run: |
          set -euo pipefail
          verify() {
            local base="$1"
            local body=""
            for attempt in 1 2 3 4 5; do
              body=$(curl -fsS --connect-timeout 10 --max-time 20 \
                -H 'Cache-Control: no-cache' \
                "${base}/__version?t=$(date +%s%N)" || true)
              echo "verify ${base} attempt ${attempt}: ${body}"
              if printf '%s' "$body" | grep -Fq "${GITHUB_SHA}"; then
                return 0
              fi
              sleep $((attempt * 3))
            done
            echo "ERROR: ${base} is not serving deployed SHA ${GITHUB_SHA}"
            return 1
          }
          verify "https://ten-bagger.cw120-park.workers.dev"
          verify "https://simpleornothing.com"
