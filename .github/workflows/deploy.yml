name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    paths-ignore:
      - 'prices.json'        # 시세 크론 커밋은 배포 불필요
      - 'news.json'          # 뉴스 크론 커밋은 배포 불필요(리포 전용)
      - 'signal_drafts.json' # 트리아지 후보 커밋은 배포 불필요(검토용)
  workflow_dispatch: {}

permissions:
  contents: read

# main이 짧은 간격으로 연속 갱신될 때 여러 Wrangler 배포가 겹치면
# 이전 실행의 SHA 검증이 더 최신 배포에 의해 무효화될 수 있다.
# 실제 서비스에는 최신 main만 필요하므로 진행 중인 구형 배포는 취소하고 최신 1건만 유지한다.
concurrency:
  group: cloudflare-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: wrangler deploy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler v4
        run: npm install -g wrangler@4

      - name: Build site change history from last verified deployment
        id: site_history
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 5 --max-time 10 \
            -H 'Cache-Control: no-cache' \
            "https://simpleornothing.com/__version?t=$(date +%s%N)" > /tmp/prev-version.json || echo '{}' > /tmp/prev-version.json
          curl -fsS --connect-timeout 5 --max-time 10 \
            -H 'Cache-Control: no-cache' \
            "https://simpleornothing.com/__site_changes?t=$(date +%s%N)" > /tmp/prev-site-history.json || echo '[]' > /tmp/prev-site-history.json

          PREV_SHA=$(node -e "try{const j=require('/tmp/prev-version.json');process.stdout.write(j.sha||'')}catch(e){}")
          if [ -n "$PREV_SHA" ] && git cat-file -e "$PREV_SHA^{commit}" 2>/dev/null; then
            git diff --name-only "$PREV_SHA" "$GITHUB_SHA" > /tmp/site-changed-files.txt
          else
            git show --pretty='' --name-only "$GITHUB_SHA" > /tmp/site-changed-files.txt
          fi
          git log -1 --format=%s > /tmp/site-change-title.txt

          node <<'NODE'
          const fs = require('fs');
          const prev = (() => { try { const x=JSON.parse(fs.readFileSync('/tmp/prev-site-history.json','utf8')); return Array.isArray(x)?x:[]; } catch { return []; } })();
          const files = fs.readFileSync('/tmp/site-changed-files.txt','utf8').split(/\r?\n/).filter(Boolean);
          const title = fs.readFileSync('/tmp/site-change-title.txt','utf8').trim();
          const sha = process.env.GITHUB_SHA;
          const date = new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());

          const internalPrefix = /^(chore|ci|build|docs|test|style|refactor|perf|revert)(\([^)]*\))?!?:/i;
          const excluded = /^(\.github\/|scripts\/|raw\/|history\/|archive\/|patches\/|node_modules\/)/;
          const configOnly = /^(package(-lock)?\.json|wrangler\.jsonc|\.assetsignore|\.gitignore|.*\.md)$/i;
          const userFacing = files.filter(f => {
            if (excluded.test(f) || configOnly.test(f)) return false;
            if (!f.includes('/')) return /\.(html?|js|css|json|svg|png|jpe?g|webp|ico)$/i.test(f);
            return /\.(html?|js|css|json|svg|png|jpe?g|webp|ico)$/i.test(f);
          });
          const shouldAdd = !!title && !internalPrefix.test(title) && userFacing.length > 0;

          const seed = [
            {sha:'verified-20260816-rank-split',commit:{author:{date:'2026-08-16T00:50:34+09:00'},message:'05 투자매력도와 실제 비중조절 순위를 분리하고 포트폴리오 집중·중복 노출을 별도 반영'}},
            {sha:'verified-20260816-contribution',commit:{author:{date:'2026-08-16T03:13:39+09:00'},message:'05 순위 근거를 EPS·상승여력의 실제 점수 기여도로 변경'}},
            {sha:'verified-20260816-duplicate',commit:{author:{date:'2026-08-16T03:16:07+09:00'},message:'05 추정 리비전 트래커의 중복 설명 블록 제거'}},
            {sha:'verified-20260816-negative',commit:{author:{date:'2026-08-16T03:24:05+09:00'},message:'05 음수 수치를 빨간색으로 표시'}},
            {sha:'verified-20260816-sort',commit:{author:{date:'2026-08-16T03:28:57+09:00'},message:'05 투자매력도·실제 비중조절 등 주요 항목 헤더 클릭 정렬 추가'}},
            {sha:'859adaac5a27d345f38465eaa23d13232b3b8634',commit:{author:{date:'2026-08-16T12:46:36+09:00'},message:'배포 후 simpleornothing.com이 최신 GitHub SHA를 실제 서비스하는지 자동 검증하고 주요 화면 캐시를 방지'}},
            {sha:'8d7722b92d7c3f0a3fa5816d29eb584034ae61ec',commit:{author:{date:'2026-08-16T12:54:28+09:00'},message:'사이트 변경 이력을 GitHub 커밋이 아니라 실제 사용자 향 변경·custom domain 배포 기준으로 전환'}}
          ];

          const rows = [...prev];
          for (const s of seed) if (!rows.some(x => x && x.sha === s.sha)) rows.push(s);
          if (shouldAdd && !rows.some(x => x && x.sha === sha)) {
            rows.unshift({
              sha,
              siteVerifiedRequired:true,
              userFacingFiles:userFacing,
              commit:{author:{date:date+'T00:00:00+09:00'},message:title.replace(/\s*\(#\d+\)\s*$/,'')}
            });
          }
          const seen = new Set();
          const clean = rows.filter(x => {
            const key = (x&&x.sha) || JSON.stringify(x);
            if (seen.has(key)) return false;
            seen.add(key); return true;
          }).sort((a,b)=>String(b?.commit?.author?.date||'').localeCompare(String(a?.commit?.author?.date||''))).slice(0,100);
          fs.writeFileSync('site-change-commits.json', JSON.stringify(clean,null,2)+'\n');
          fs.writeFileSync('/tmp/site-history-expected.txt', shouldAdd?'1':'0');
          console.log('site-facing files:', userFacing);
          console.log('record current deploy:', shouldAdd, title);
          NODE
          echo "expected=$(cat /tmp/site-history-expected.txt)" >> "$GITHUB_OUTPUT"

      - name: Deploy
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # 런타임 env var와 asset binding이 동시에 누락되는 사례에도 최신 배포 SHA를
          # 검증할 수 있도록 배포 직전 worker bundle에 immutable fallback 값을 넣는다.
          GITHUB_SHA="$GITHUB_SHA" DEPLOYED_AT="$DEPLOYED_AT" node <<'NODE'
          const fs = require('fs');
          const path = 'worker-hotfix.js';
          let src = fs.readFileSync(path, 'utf8');
          const shaNeedle = 'let sha = env.DEPLOY_SHA || "";';
          const atNeedle = 'let deployedAt = env.DEPLOYED_AT || "";';
          if (!src.includes(shaNeedle) || !src.includes(atNeedle)) {
            throw new Error('version fallback patch target not found');
          }
          src = src.replace(shaNeedle, `let sha = env.DEPLOY_SHA || ${JSON.stringify(process.env.GITHUB_SHA)};`);
          src = src.replace(atNeedle, `let deployedAt = env.DEPLOYED_AT || ${JSON.stringify(process.env.DEPLOYED_AT)};`);
          fs.writeFileSync(path, src);
          NODE

          # 같은 asset bundle에도 immutable 버전 메타데이터를 함께 넣어 이중 fallback을 유지한다.
          GITHUB_SHA="$GITHUB_SHA" DEPLOYED_AT="$DEPLOYED_AT" \
            node -e 'const fs=require("fs");fs.writeFileSync("deploy-version.json",JSON.stringify({sha:process.env.GITHUB_SHA,deployedAt:process.env.DEPLOYED_AT})+"\n")'

          for attempt in 1 2 3; do
            if wrangler deploy --var "DEPLOY_SHA:${GITHUB_SHA}" --var "DEPLOYED_AT:${DEPLOYED_AT}"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Cloudflare API 일시 오류로 배포 재시도 ($attempt/3)"
            sleep $((attempt * 10))
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployed SHA and visible site change on custom domain
        shell: bash
        run: |
          set -euo pipefail
          verify() {
            local base="$1"
            local body=""
            for attempt in 1 2 3 4 5 6 7 8; do
              body=$(curl -fsS --connect-timeout 10 --max-time 20 \
                -H 'Cache-Control: no-cache' \
                "${base}/__version?t=$(date +%s%N)" || true)
              echo "verify ${base} attempt ${attempt}: ${body}"
              if printf '%s' "$body" | grep -Fq "${GITHUB_SHA}"; then
                return 0
              fi
              if [ "$attempt" -lt 8 ]; then
                sleep $((attempt * 4))
              fi
            done
            echo "ERROR: ${base} is not serving deployed SHA ${GITHUB_SHA} after propagation retries"
            return 1
          }
          # wrangler.jsonc는 custom domain만 구성한다. workers.dev 서브도메인은 배포 대상이 아니므로
          # 실제 프로덕션 엔드포인트인 custom domain만 최신 SHA를 서비스하는지 검증한다.
          verify "https://simpleornothing.com"

          # index.html의 inline script가 document.write 문자열 속 literal </script> 때문에 조기 종료되면
          # 이후 JavaScript가 화면 하단에 본문 텍스트로 노출된다. 실제 custom domain HTML을 파싱해 재발을 막는다.
          page_ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsS --connect-timeout 10 --max-time 30 \
              -H 'Cache-Control: no-cache' \
              "https://simpleornothing.com/?t=$(date +%s%N)" > /tmp/live-index.html; then
              if python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Probe(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.script_depth = 0
                  self.leaks = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == 'script':
                      self.script_depth += 1
              def handle_endtag(self, tag):
                  if tag.lower() == 'script' and self.script_depth:
                      self.script_depth -= 1
              def handle_data(self, data):
                  if self.script_depth == 0 and ('window.__vcInit' in data or 'w.document.close();' in data):
                      self.leaks.append(data[:240])

          html = Path('/tmp/live-index.html').read_text(encoding='utf-8')
          dangerous = '<script defer src="oracle-release-card.js?v=20260912"></script>'
          if dangerous in html:
              raise SystemExit('dangerous nested literal </script> still present in live HTML')
          p = Probe()
          p.feed(html)
          if p.leaks:
              raise SystemExit('raw JavaScript leaked outside <script>: ' + repr(p.leaks[:2]))
          print('live index script-boundary verified')
          PY
              then
                page_ok=1
                break
              fi
            fi
            if [ "$attempt" -lt 8 ]; then
              sleep $((attempt * 4))
            fi
          done
          if [ "$page_ok" -ne 1 ]; then
            echo "ERROR: live index still exposes raw JavaScript text after propagation retries"
            exit 1
          fi

          probe_ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            probe=$(curl -fsS --connect-timeout 10 --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "https://simpleornothing.com/__changelog_probe?t=$(date +%s%N)" || true)
            echo "verify visible changelog attempt ${attempt}: ${probe}"
            if printf '%s' "$probe" | grep -Fq '"ok":true'; then
              probe_ok=1
              break
            fi
            if [ "$attempt" -lt 8 ]; then
              sleep $((attempt * 4))
            fi
          done
          if [ "$probe_ok" -ne 1 ]; then
            echo "ERROR: deployed site does not expose the expected visible changelog rows after propagation retries"
            exit 1
          fi

          if [ "${{ steps.site_history.outputs.expected }}" = "1" ]; then
            ok=0
            for attempt in 1 2 3 4 5 6 7 8; do
              history=$(curl -fsS --connect-timeout 10 --max-time 20 \
                -H 'Cache-Control: no-cache' \
                "https://simpleornothing.com/__site_changes?t=$(date +%s%N)" || true)
              echo "verify site change history attempt ${attempt}: ${history:0:500}"
              if printf '%s' "$history" | grep -Fq "${GITHUB_SHA}"; then
                ok=1
                break
              fi
              if [ "$attempt" -lt 8 ]; then
                sleep $((attempt * 4))
              fi
            done
            if [ "$ok" -ne 1 ]; then
              echo "ERROR: actual site changed but site change history does not contain ${GITHUB_SHA} after propagation retries"
              exit 1
            fi
          fi
