name: Apply CPI market card 2026-09-12
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-cpi-market-card-20260912.yml'
permissions:
  contents: write
  pull-requests: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add 01 CPI card and harden sync
        run: python3 scripts/add-cpi-market-card-20260912.py
      - name: Validate card and consumers
        run: |
          set -euo pipefail
          node --check trade.js
          node --check scripts/sync-us-cpi-release.mjs
          python3 - <<'PY'
          import json
          r=json.load(open('cpi_release.json'))
          z=r['latest']
          assert z['ym']=='2026-08' and z['headlineMom']==0.4 and z['headlineYoy']==3.4 and z['coreMom']==0.3 and z['coreYoy']==2.4
          c=json.load(open('cpi.json')); assert c['series']['us'][-1]==['2026-08-01',3.4]
          for f in ['periodic_release_check.json','audit/official-release-checks/2026-09-12.json']:
              j=json.load(open(f)); assert any('01 CPI 카드' in x for x in j['consumers'])
          PY
          grep -Fq 'function mountCpi()' trade.js
          grep -Fq "cpi_release.json" trade.js
          grep -Fq "mkt_us_cpi" .github/workflows/verify-periodic-live.yml
          grep -Fq "cpi_release.json" .github/workflows/update-cpi.yml
          git diff --check
      - name: Commit patch and open PR
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          BRANCH="automation/cpi-market-card-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git add trade.js cpi_release.json scripts/sync-us-cpi-release.mjs .github/workflows/update-cpi.yml .github/workflows/verify-periodic-live.yml periodic_release_check.json audit/official-release-checks/2026-09-12.json
          git commit -m 'fix: add official CPI card to market monitoring'
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title 'fix: add official CPI card to 01 market monitoring' --body 'BLS 8월 CPI 공식값을 01 시장 모니터링의 독립 카드로 추가하고 cpi_release.json 메타데이터와 cpi.json 시계열을 교차 사용합니다. 헤드라인 현재값, 전월 비교, 근원 CPI 해석, SVG 차트를 한 카드에서 렌더합니다. 향후 CPI 동기화와 프로덕션 검증도 동적 release metadata 기준으로 보강합니다.'
