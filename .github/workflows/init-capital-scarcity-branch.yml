name: Finalize capital scarcity integration

on:
  push:
    branches:
      - agent/add-capital-scarcity-monitor

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-capital-scarcity-monitor
          fetch-depth: 0
      - name: Fix index loader placement and remove temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          bad="body+'<script src=\"capital-scarcity.js\" defer></script>\n</body></html>'"
          if bad in s:
              s=s.replace(bad,"body+'</body></html>'",1)
          p.write_text(s)
          PY
          git rm .github/workflows/init-capital-scarcity-branch.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git add -u
          git commit -m "fix: finalize capital scarcity site wiring"
          git push origin HEAD:agent/add-capital-scarcity-monitor
