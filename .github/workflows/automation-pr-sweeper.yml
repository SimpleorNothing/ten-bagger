name: Automation PR Sweeper

on:
  push:
    branches: [main]
  workflow_run:
    workflows:
      - "Update stock prices"
      - "Update news feed"
      - "Update global CPI"
      - "Update macro signals"
      - "Derive signal drafts"
      - "Update AI capital scarcity monitor"
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: automation-pr-sweeper
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      AUTO_MERGE_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete orphaned company-news automation branches
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --heads origin 'refs/heads/claude/automation-company-news-*' | while read -r sha ref; do
            [ -n "${ref:-}" ] || continue
            branch="${ref#refs/heads/}"
            open_count=$(gh pr list --state open --head "$branch" --json number --jq 'length')
            if [ "$open_count" = "0" ]; then
              gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch"
              echo "Deleted orphan company-news branch $branch"
            fi
          done

      - name: Close superseded duplicate automation PRs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t PRS < <(gh pr list --state open --base main --limit 200 \
            --json number,title,headRefName,createdAt,author \
            --jq '.[] | select((.headRefName | startswith("claude/")) or (.headRefName | startswith("automation/"))) | select(.author.login == "app/github-actions" or .author.login == "github-actions") | [.number,.createdAt,.title] | @tsv' \
            | sort -t$'\t' -k2,2r)

          declare -A SEEN=()
          for row in "${PRS[@]:-}"; do
            [ -n "$row" ] || continue
            IFS=$'\t' read -r pr created title <<< "$row"

            key="$title"
            case "$title" in
              site-apply:\ signal-log-*) key="site-apply: signal-log" ;;
              site-apply:\ calendar-*)   key="site-apply: calendar" ;;
              site-apply:\ risk-*)       key="site-apply: risk" ;;
              site-apply:\ gates-*)      key="site-apply: gates" ;;
            esac

            case "$title" in
              "chore: sync holdings.json from latest Saturday 자산현황"|\
              "chore: sync holdings and reconcile consumers"|\
              "chore: recompute alpha map estimates"|\
              "chore: sync official CPI release"|\
              "chore: update raw news feed"|\
              "chore: update macro signals (VIX·S&P·F&G)"|\
              "chore: derive signal drafts from news"|\
              "chore: update stock prices + 1y charts"|\
              "chore: update market data + integrity-audited revisions"|\
              site-apply:\ signal-log-*|\
              site-apply:\ calendar-*|\
              site-apply:\ risk-*|\
              site-apply:\ gates-*)
                if [[ -n "${SEEN[$key]:-}" ]]; then
                  gh pr comment "$pr" --body "자동화 중복 PR 정리: 같은 작업의 더 최신 PR #${SEEN[$key]}가 열려 있어 이 PR을 종료합니다." || true
                  gh pr close "$pr" --delete-branch || gh pr close "$pr" || true
                else
                  SEEN[$key]="$pr"
                fi
                ;;
            esac
          done

      - name: Validate and merge trusted automation PRs
        shell: bash
        run: |
          set -u
          mapfile -t PRS < <(gh pr list --state open --base main --limit 200 \
            --json number,headRefName,headRefOid,author,isDraft,title \
            --jq '.[] | select((.headRefName | startswith("claude/")) or (.headRefName | startswith("automation/"))) | select(.author.login == "app/github-actions" or .author.login == "github-actions") | select(.isDraft == false) | [.number,.headRefName,.headRefOid,.title] | @tsv')

          validate_pr() {
            local pr="$1"
            local sha="$2"

            git fetch origin "pull/$pr/head:refs/remotes/origin/pr-$pr" --force || return 1
            git reset --hard "origin/pr-$pr" || return 1

            local size
            size=$(stat -c%s index.html) || return 1
            [ "$size" -gt 150000 ] || return 1
            grep -q "const D=" index.html || return 1
            grep -q "HOLDINGS" index.html || return 1

            for f in alpha.json earnings.json judgment.json news.json prices.json; do
              if [ -f "$f" ]; then
                python3 -c "import json; json.load(open('$f'))" || return 1
              fi
            done

            node --check worker.js || return 1
            grep -Fq 'const SITE_APPLY_FILES = new Set(["gates.json", "risk.json", "signal_log.json", "calendar.json"]);' worker.js || return 1
            grep -Fq 'if (file === "signal_log.json")' worker.js || return 1
            grep -Fq 'if (file === "calendar.json")' worker.js || return 1
            grep -Fq 'function normalizeInsightFiscalJSON' worker.js || return 1
            grep -Fq 'disableThinking: true' worker.js || return 1
            grep -Fq 'function mergeGaugeUpdates' worker.js || return 1
            grep -Fq 'gauge_updates' worker.js || return 1
            if grep -Fq 'gauge shape mismatch' worker.js; then return 1; fi
            if grep -Fq 'claude response not json' worker.js; then return 1; fi

            gh api --method POST "repos/$GH_REPO/statuses/$sha" \
              -f state=success \
              -f context='Claude PR Gate / validate' \
              -f description='Validated by automation PR sweeper' >/dev/null || return 1
          }

          stale_holdings_pr() {
            local branch="$1"
            [ -f holdings.json ] || return 1
            git show origin/main:holdings.json > /tmp/main-holdings.json 2>/dev/null || return 1
            python3 - <<'PY'
          import json, sys
          with open('/tmp/main-holdings.json', encoding='utf-8') as f:
              main = json.load(f)
          with open('holdings.json', encoding='utf-8') as f:
              pr = json.load(f)
          def qty_map(x):
              return {str(d.get('ticker') or d.get('name')): d.get('qty') for d in x.get('detail', [])}
          main_qty_asof = str(main.get('qtyAsOf') or '')
          pr_qty_asof = str(pr.get('qtyAsOf') or '')
          same_or_older_source = bool(pr_qty_asof) and bool(main_qty_asof) and pr_qty_asof <= main_qty_asof
          same_quantities = qty_map(main) == qty_map(pr)
          sys.exit(0 if same_or_older_source and same_quantities else 1)
          PY
          }

          failures=0
          for row in "${PRS[@]:-}"; do
            [ -n "$row" ] || continue
            IFS=$'\t' read -r pr branch sha title <<< "$row"
            echo "Processing PR #$pr ($branch @ $sha)"

            if ! validate_pr "$pr" "$sha"; then
              echo "Validation/status failed for PR #$pr; leaving it open for inspection"
              gh pr comment "$pr" --body "Automation PR Sweeper가 검증 또는 상태 기록에 실패해 자동 병합을 건너뛰었습니다. 다음 실행에서 다시 시도합니다." || true
              failures=$((failures + 1))
              continue
            fi

            if [ -n "${AUTO_MERGE_TOKEN:-}" ]; then
              if GH_TOKEN="$AUTO_MERGE_TOKEN" gh pr merge "$pr" --squash --delete-branch; then
                echo "Merged PR #$pr with AUTO_MERGE_TOKEN"
                continue
              fi
            fi

            if gh pr merge "$pr" --squash --delete-branch; then
              echo "Merged PR #$pr with GITHUB_TOKEN"
            else
              mergeable=$(gh pr view "$pr" --json mergeable --jq '.mergeable' 2>/dev/null || echo UNKNOWN)
              if [ "$mergeable" = "CONFLICTING" ]; then
                if [ "$title" = "chore: sync holdings and reconcile consumers" ] && stale_holdings_pr "$branch"; then
                  echo "PR #$pr is a stale holdings refresh with unchanged quantities; closing it"
                  gh pr comment "$pr" --body "현재 main의 qtyAsOf가 같거나 더 최신이고 보유 수량도 동일합니다. 이 PR은 오래된 시가 파생 금액·비중만 되돌리는 충돌 PR이라 자동 종료합니다." || true
                  gh pr close "$pr" --delete-branch || gh pr close "$pr" || true
                else
                  echo "PR #$pr is conflicting with main; leaving it open for scheduled/operator recovery"
                  gh pr comment "$pr" --body "현재 main과 충돌해 자동 병합하지 않았습니다. 중복 PR이면 다음 sweep에서 정리되고, 최신 단일 PR이면 주기 점검 루틴에서 재생성/정리합니다." || true
                fi
              else
                echo "Direct merge blocked for PR #$pr; enabling auto-merge"
                gh pr merge "$pr" --squash --auto --delete-branch || true
              fi
            fi
          done

          if [ "$failures" -gt 0 ]; then
            echo "Completed with $failures PR validation/status failures; other PRs were still processed."
          fi
