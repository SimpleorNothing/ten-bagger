name: Automation PR Sweeper

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: automation-pr-sweeper
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Close superseded duplicate automation PRs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t PRS < <(gh pr list --state open --base main --limit 200 \
            --json number,title,headRefName,createdAt,author \
            --jq '.[] | select(.headRefName | startswith("claude/")) | select(.author.login == "app/github-actions" or .author.login == "github-actions") | [.number,.createdAt,.title] | @tsv' \
            | sort -t$'\t' -k2,2r)

          declare -A SEEN=()
          for row in "${PRS[@]:-}"; do
            [ -n "$row" ] || continue
            IFS=$'\t' read -r pr created title <<< "$row"
            case "$title" in
              "chore: sync holdings.json from latest Saturday 자산현황"|\
              "chore: recompute alpha map estimates"|\
              "chore: sync official CPI release"|\
              "chore: update raw news feed"|\
              "chore: update macro signals (VIX·S&P·F&G)"|\
              "chore: derive signal drafts from news"|\
              "chore: update stock prices + 1y charts")
                if [[ -n "${SEEN[$title]:-}" ]]; then
                  gh pr comment "$pr" --body "자동화 중복 PR 정리: 더 최신 PR #${SEEN[$title]}가 열려 있어 이 PR을 종료합니다."
                  gh pr close "$pr" --delete-branch || gh pr close "$pr"
                else
                  SEEN[$title]="$pr"
                fi
                ;;
            esac
          done

      - name: Validate and merge trusted automation PRs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t PRS < <(gh pr list --state open --base main --limit 200 \
            --json number,headRefName,headRefOid,author,isDraft \
            --jq '.[] | select(.headRefName | startswith("claude/")) | select(.author.login == "app/github-actions" or .author.login == "github-actions") | select(.isDraft == false) | [.number,.headRefName,.headRefOid] | @tsv')

          for row in "${PRS[@]:-}"; do
            [ -n "$row" ] || continue
            IFS=$'\t' read -r pr branch sha <<< "$row"
            echo "Processing PR #$pr ($branch @ $sha)"

            git fetch origin "pull/$pr/head:refs/remotes/origin/pr-$pr" --force
            git reset --hard "origin/pr-$pr"

            SIZE=$(stat -c%s index.html)
            [ "$SIZE" -gt 150000 ]
            grep -q "const D=" index.html
            grep -q "HOLDINGS" index.html

            for f in alpha.json earnings.json judgment.json news.json prices.json; do
              if [ -f "$f" ]; then
                python3 -c "import json; json.load(open('$f'))"
              fi
            done

            node --check worker.js
            grep -Fq 'const SITE_APPLY_FILES = new Set(["gates.json", "risk.json", "signal_log.json", "calendar.json"]);' worker.js
            grep -Fq 'if (file === "signal_log.json")' worker.js
            grep -Fq 'if (file === "calendar.json")' worker.js
            grep -Fq 'function normalizeInsightFiscalJSON' worker.js
            grep -Fq 'disableThinking: true' worker.js
            grep -Fq 'function mergeGaugeUpdates' worker.js
            grep -Fq 'gauge_updates' worker.js
            ! grep -Fq 'gauge shape mismatch' worker.js
            ! grep -Fq 'claude response not json' worker.js

            gh api --method POST "repos/$GH_REPO/statuses/$sha" \
              -f state=success \
              -f context='Claude PR Gate / validate' \
              -f description='Validated by automation PR sweeper' >/dev/null

            if gh pr merge "$pr" --squash --delete-branch; then
              echo "Merged PR #$pr"
            else
              echo "Direct merge blocked for PR #$pr; enabling auto-merge"
              gh pr merge "$pr" --squash --auto --delete-branch || true
            fi
          done
