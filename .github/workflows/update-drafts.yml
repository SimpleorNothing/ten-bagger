name: Derive signal drafts

on:
  schedule:
    - cron: '45 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: derive-drafts
  cancel-in-progress: false

jobs:
  drafts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Derive signal drafts from news.json
        run: node scripts/derive-drafts.mjs
      - name: Create protected-main PR if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE="signal_drafts.json"
          if [ -z "$(git status --porcelain "$FILE")" ]; then
            echo "No change in $FILE."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="claude/automation-update-drafts-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$BRANCH"
          git add "$FILE"
          git commit -m "chore: derive signal drafts from news"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "chore: derive signal drafts from news" --body "Automated daily signal draft refresh. Claude PR Gate validates and squash-merges this protected-main PR."
