# .github/workflows/fetch-tsla-deliveries.yml
name: fetch-tsla-deliveries

on:
  schedule:
    - cron: "50 14 2 1,4,7,10 *"
    - cron: "0 0 3 1,4,7,10 *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tsla-deliveries
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch & tag TSLA deliveries
        id: run
        run: node scripts/fetch-tsla-deliveries.mjs
        env:
          TSLA_CONSENSUS_FALLBACK: "406024"

      - name: Open protected-main PR when signal_log changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain signal_log.json)" ]; then
            echo "변경 없음 — 이미 적재됐거나 보도자료 미게시. skip."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="claude/automation-tsla-deliveries-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$BRANCH"
          git add signal_log.json
          git commit -m "tsla: 분기 인도 보고 자동 적재 (auto)"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "tsla: 분기 인도 보고 자동 적재" --body "Tesla 공식 분기 인도 발표를 signal_log에 반영합니다. 보호된 main에는 직접 push하지 않고 Claude PR Gate 검증·자동병합 경로를 사용합니다."

      - name: Notify (Slack)
        if: ${{ steps.run.outputs.summary != '' }}
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SUMMARY:       ${{ steps.run.outputs.summary }}
        run: |
          if [[ -z "$SLACK_WEBHOOK" ]]; then
            echo "SLACK_WEBHOOK_URL 미설정 — 알림 skip"; exit 0
          fi
          jq -n --arg t "$SUMMARY" '{text:$t}' \
            | curl -sS -X POST -H 'Content-type: application/json' \
                   --data @- "$SLACK_WEBHOOK" >/dev/null
