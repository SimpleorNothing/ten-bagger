name: Sync NHPLUG Worker secrets

on:
  push:
    branches: [main]
    paths:
      - 'nhplug-portfolio.js'
      - 'worker.js'
      - '.github/workflows/nhplug-secrets.yml'
  # Repository secrets를 나중에 등록해도 별도 수동 실행 없이 다음 주기에 Worker로 전파한다.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nhplug-worker-secret-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      NHPLUG_APP_KEY: ${{ secrets.NHPLUG_APP_KEY }}
      NHPLUG_APP_SECRET: ${{ secrets.NHPLUG_APP_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check NHPLUG credentials
        id: configured
        shell: bash
        run: |
          if [ -n "$NHPLUG_APP_KEY" ] && [ -n "$NHPLUG_APP_SECRET" ]; then
            echo 'ready=1' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=0' >> "$GITHUB_OUTPUT"
            echo 'NHPLUG_APP_KEY / NHPLUG_APP_SECRET are not configured yet; skip Worker secret sync.'
          fi
      - name: Install Wrangler v4
        if: steps.configured.outputs.ready == '1'
        run: npm install -g wrangler@4
      - name: Put NHPLUG secrets
        if: steps.configured.outputs.ready == '1'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$NHPLUG_APP_KEY" | wrangler secret put NHPLUG_APP_KEY
          printf '%s' "$NHPLUG_APP_SECRET" | wrangler secret put NHPLUG_APP_SECRET
