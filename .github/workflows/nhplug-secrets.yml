name: Sync NHPLUG Worker secrets

on:
  push:
    branches: [main]
    paths:
      - 'nhplug-portfolio.js'
      - 'worker.js'
      - '.github/workflows/nhplug-secrets.yml'
  # Repository secrets를 나중에 등록해도 별도 수동 실행 없이 다음 주기에 Worker로 전파한다.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nhplug-worker-secret-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      NHPLUG_APP_KEY: ${{ secrets.NHPLUG_APP_KEY }}
      NHPLUG_APP_SECRET: ${{ secrets.NHPLUG_APP_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check NHPLUG credentials
        id: configured
        shell: bash
        run: |
          if [ -n "$NHPLUG_APP_KEY" ] && [ -n "$NHPLUG_APP_SECRET" ]; then
            echo 'ready=1' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=0' >> "$GITHUB_OUTPUT"
            echo 'NHPLUG_APP_KEY / NHPLUG_APP_SECRET are not configured yet; skip Worker secret sync.'
          fi
      - name: Probe Worker credential state
        if: steps.configured.outputs.ready == '1'
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(python - <<'PY'
          import hashlib, os
          secret = os.environ['NHPLUG_APP_SECRET']
          print(hashlib.sha256(f'alpha-map:portfolio-read:v1:{secret}'.encode()).hexdigest())
          PY
          )
          code=$(curl -sS --connect-timeout 10 --max-time 20 \
            -H "x-portfolio-api-token: ${TOKEN}" \
            -H 'Cache-Control: no-cache' \
            -o /tmp/nhplug-probe.json \
            -w '%{http_code}' \
            "https://simpleornothing.com/api/portfolio/live?t=$(date +%s%N)" || true)
          body=$(cat /tmp/nhplug-probe.json 2>/dev/null || true)
          echo "Worker probe HTTP ${code}"

          # 200: 같은 자격증명으로 정상 동작.
          # 502: Worker에는 같은 자격증명이 이미 들어갔지만 NH 측 호출이 실패한 상태이므로 secret 재배포 대상이 아님.
          if [ "$code" = '200' ] || [ "$code" = '502' ]; then
            echo 'needs_sync=0' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 401: Repository의 현재 App Secret에서 파생한 토큰과 Worker가 다름 => 키 변경 또는 Worker 미동기화.
          # 503 + NHPLUG_NOT_CONFIGURED: Worker secret 자체가 없음.
          if [ "$code" = '401' ] || { [ "$code" = '503' ] && printf '%s' "$body" | grep -Fq 'NHPLUG_NOT_CONFIGURED'; }; then
            echo 'needs_sync=1' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 네트워크/사이트 일시 오류 때 무작정 secret을 다시 배포하지 않는다. 다음 5분 주기에 재확인한다.
          echo 'needs_sync=0' >> "$GITHUB_OUTPUT"
          echo "Probe inconclusive; skip secret deployment this run: ${body:0:300}"
      - name: Install Wrangler v4
        if: steps.configured.outputs.ready == '1' && steps.probe.outputs.needs_sync == '1'
        run: npm install -g wrangler@4
      - name: Put NHPLUG secrets
        if: steps.configured.outputs.ready == '1' && steps.probe.outputs.needs_sync == '1'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$NHPLUG_APP_KEY" | wrangler secret put NHPLUG_APP_KEY
          printf '%s' "$NHPLUG_APP_SECRET" | wrangler secret put NHPLUG_APP_SECRET
