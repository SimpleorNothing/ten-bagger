name: daily-brief-slack
on:
  schedule:
    - cron: '45 22 * * 1-5'
  workflow_dispatch:
jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Send deterministic daily brief only
        run: node scripts/daily-brief-slack.mjs
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_DM_CHANNEL: U0BED4031U6
