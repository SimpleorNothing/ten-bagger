name: Materialize revision CSV download

on:
  push:
    branches:
      - claude/revision-csv-download-v2-20260816
    paths:
      - 'scripts/patch-revision-csv-download-once.mjs'
      - '.github/workflows/materialize-revision-csv-download.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/revision-csv-download-v2-20260816
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Materialize audited CSV download
        run: node scripts/patch-revision-csv-download-once.mjs
      - name: Commit materialized index
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then echo 'No index change'; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: download sourced revision audit CSV"
          git push origin HEAD:claude/revision-csv-download-v2-20260816
