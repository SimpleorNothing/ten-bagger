name: Fix Oracle roadmap markup
on:
  push:
    branches: ["sync/oracle-q1fy27-20260912"]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/oracle-q1fy27-20260912
      - name: Repair markup and validate JS parse
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('aisd.js')
          s=p.read_text()
          old='<span><span class="k">Oracle FY27 Q1 · OCI <b>'
          new='<span><span class="k">Oracle FY27 Q1</span>OCI <b>'
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s)
          elif new not in s:
              raise SystemExit('Oracle markup anchor not found')
          PY
          node --check aisd.js
          node --check oracle-release-card.js
          node --check council-view-collapse.js
      - name: Commit repair
        run: |
          if git diff --quiet; then echo 'No repair needed'; exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add aisd.js
          git commit -m "fix: close Oracle roadmap metric label"
          git push origin HEAD:sync/oracle-q1fy27-20260912
