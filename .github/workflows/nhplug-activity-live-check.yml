name: NHPLUG activity live check

on:
  push:
    branches: [main]
    paths:
      - 'nhplug-activity.js'
      - 'portfolio-intelligence-ui.js'
      - 'worker.js'
      - 'worker-entry.js'
      - '.github/workflows/nhplug-activity-live-check.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  production-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Wait for production SHA
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 12); do
            body=$(curl -fsS --connect-timeout 10 --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "https://simpleornothing.com/__version?t=$(date +%s%N)" || true)
            if printf '%s' "$body" | grep -Fq "${GITHUB_SHA}"; then
              ok=1
              break
            fi
            sleep $((attempt * 3))
          done
          if [ "$ok" -ne 1 ]; then
            echo "ERROR: production has not reached ${GITHUB_SHA}"
            exit 1
          fi

      - name: Verify authenticated portfolio activity API
        shell: bash
        env:
          NHPLUG_APP_SECRET: ${{ secrets.NHPLUG_APP_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${NHPLUG_APP_SECRET:-}" ]; then
            echo "ERROR: NHPLUG_APP_SECRET is not configured"
            exit 1
          fi
          TOKEN=$(node -e "const c=require('crypto');process.stdout.write(c.createHash('sha256').update('alpha-map:portfolio-read:v1:'+process.env.NHPLUG_APP_SECRET).digest('hex'))")
          code=$(curl -sS --connect-timeout 10 --max-time 60 \
            -H 'Cache-Control: no-cache' \
            -H "x-portfolio-api-token: ${TOKEN}" \
            -o /tmp/activity.json \
            -w '%{http_code}' \
            "https://simpleornothing.com/api/portfolio/activity?days=30&executionDays=10&t=$(date +%s%N)" || true)
          if [ "$code" != '200' ]; then
            echo "ERROR: portfolio activity API HTTP ${code}"
            node -e "try{const j=require('/tmp/activity.json');console.log({error:j.error||'',detail:j.detail||''})}catch{}"
            exit 1
          fi
          node <<'NODE'
          const fs=require('fs');
          const raw=fs.readFileSync('/tmp/activity.json','utf8');
          const j=JSON.parse(raw);
          if(j.source!=='NHPLUG'||j.readOnly!==true) throw new Error('source/readOnly contract mismatch');
          if(!Array.isArray(j.accounts)||j.accounts.length<1) throw new Error('supported personal account activity missing');
          if(/"(?:act_no|acct_no|account_no|cust_no|customer_no|token|secret|appkey|app_key)"\s*:/i.test(raw)) throw new Error('sensitive identifier leaked');
          const errors=j.accounts.flatMap(a=>Array.isArray(a.errors)?a.errors:[]);
          if(errors.length) throw new Error('NHPLUG activity sub-call errors: '+errors.map(x=>x.scope).join(','));
          const a=j.accounts[0];
          const statuses=[a?.domestic?.tradingPnl?.status,a?.domestic?.dailyPnl?.status,a?.overseas?.periodPnl?.status].filter(Boolean);
          for(const s of statuses){if(/오류|실패|존재하지|유효하지/i.test(String(s.message||''))) throw new Error('NHPLUG business response error: '+String(s.message||''));}
          console.log(JSON.stringify({ok:true,source:j.source,readOnly:j.readOnly,accountCount:j.accounts.length,executionCount:j.summary?.executionCount??null,transactionCount:j.summary?.transactionCount??null,domesticRealizedPnlKnown:Number.isFinite(j.summary?.domesticRealizedPnlKrw),overseasRealizedPnlKrwKnown:Number.isFinite(j.summary?.overseasRealizedPnlKrw),fetchedAt:j.fetchedAt}));
          const crypto=require('crypto');
          const report={fetchedAt:j.fetchedAt,range:j.range,executionRange:j.executionRange,summary:j.summary,accounts:j.accounts,limitations:j.limitations||[]};
          const plaintext=Buffer.from(JSON.stringify(report));
          const key=crypto.randomBytes(32),iv=crypto.randomBytes(12);
          const cipher=crypto.createCipheriv('aes-256-gcm',key,iv);
          const ciphertext=Buffer.concat([cipher.update(plaintext),cipher.final()]);
          const tag=cipher.getAuthTag();
          const pubB64='';
          const publicKey=Buffer.from(pubB64,'base64').toString('utf8');
          const wrapped=crypto.publicEncrypt({key:publicKey,padding:crypto.constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},key);
          const envelope={key:wrapped.toString('base64'),iv:iv.toString('base64'),tag:tag.toString('base64'),data:ciphertext.toString('base64')};
          fs.writeFileSync('/tmp/nhplug-30d-envelope.json',JSON.stringify(envelope));
          console.log('encrypted report envelope created');
          NODE

      - name: Upload encrypted activity envelope
        uses: actions/upload-artifact@v4
        with:
          name: nhplug-30d-envelope
          path: /tmp/nhplug-30d-envelope.json
          retention-days: 1
