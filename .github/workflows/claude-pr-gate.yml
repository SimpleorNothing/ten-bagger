name: Claude PR Gate
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Full PR gate validation
        shell: bash
        run: |
          set -euo pipefail
          BASE_REF="origin/${{ github.event.pull_request.base.ref }}"
          git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1
          git show "$BASE_REF:scripts/validate-pr-gate.sh" > /tmp/validate-pr-gate.sh
          bash /tmp/validate-pr-gate.sh "$BASE_REF"
  auto-merge:
    needs: validate
    runs-on: ubuntu-latest
    if: startsWith(github.event.pull_request.head.ref, 'claude/')
    steps:
      - name: Merge validated PR idempotently
        shell: bash
        run: |
          set -euo pipefail
          if gh pr merge "$PR" --squash --delete-branch; then
            echo "Merged PR #$PR"
            exit 0
          fi

          state=$(gh pr view "$PR" --json state,mergedAt --jq '[.state, (.mergedAt // "")] | @tsv')
          pr_state=${state%%$'\t'*}
          merged_at=${state#*$'\t'}
          if [ "$pr_state" = "MERGED" ] || [ -n "$merged_at" ]; then
            echo "PR #$PR was merged concurrently; treating as success."
            exit 0
          fi

          echo "::error::PR #$PR merge failed and PR is still open"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
