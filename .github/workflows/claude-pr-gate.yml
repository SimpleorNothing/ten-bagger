name: Claude PR Gate
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: index.html / JSON 무결성
        run: |
          SIZE=$(stat -c%s index.html); echo "index.html size: $SIZE"
          [ "$SIZE" -gt 150000 ] || { echo "::error::index.html 비정상 축소($SIZE) - 잘림 의심"; exit 1; }
          grep -q "const D=" index.html  || { echo "::error::const D= 앵커 소실"; exit 1; }
          grep -q "HOLDINGS" index.html  || { echo "::error::HOLDINGS 앵커 소실"; exit 1; }
          for f in alpha.json earnings.json judgment.json news.json prices.json; do
            if [ -f "$f" ]; then python3 -c "import json;json.load(open('$f'))" \
              || { echo "::error::$f JSON 깨짐"; exit 1; }; fi
          done
      - name: worker.js 회귀 가드
        run: |
          node --check worker.js
          grep -Fq 'const SITE_APPLY_FILES = new Set(["gates.json", "risk.json", "signal_log.json", "calendar.json"]);' worker.js \
            || { echo "::error::사이트 반영 대상 SoT 소실"; exit 1; }
          grep -Fq 'if (file === "signal_log.json")' worker.js \
            || { echo "::error::signal_log 반영 경로 소실"; exit 1; }
          grep -Fq 'if (file === "calendar.json")' worker.js \
            || { echo "::error::calendar 반영 경로 소실"; exit 1; }
          grep -Fq 'function normalizeInsightFiscalJSON' worker.js \
            || { echo "::error::인사이트 FY/FQ 정규화 소실"; exit 1; }
          grep -Fq 'disableThinking: true' worker.js \
            || { echo "::error::Claude JSON 재시도 경로 소실"; exit 1; }
          grep -Fq 'function mergeGaugeUpdates' worker.js \
            || { echo "::error::게이지 부분 병합 보호 경로 소실"; exit 1; }
          grep -Fq 'gauge_updates' worker.js \
            || { echo "::error::게이지 부분 갱신 프롬프트 소실"; exit 1; }
          if grep -Fq 'gauge shape mismatch' worker.js; then
            echo "::error::구형 전체 배열 일치 검증 재유입"
            exit 1
          fi
          if grep -Fq 'claude response not json' worker.js; then
            echo "::error::구형 단발 JSON 파싱 경로 재유입"
            exit 1
          fi
  auto-merge:
    needs: validate
    runs-on: ubuntu-latest
    if: startsWith(github.event.pull_request.head.ref, 'claude/')
    steps:
      - name: Merge validated PR idempotently
        shell: bash
        run: |
          set -euo pipefail
          if gh pr merge "$PR" --squash --delete-branch; then
            echo "Merged PR #$PR"
            exit 0
          fi

          state=$(gh pr view "$PR" --json state,mergedAt --jq '[.state, (.mergedAt // "")] | @tsv')
          pr_state=${state%%$'\t'*}
          merged_at=${state#*$'\t'}
          if [ "$pr_state" = "MERGED" ] || [ -n "$merged_at" ]; then
            echo "PR #$PR was merged concurrently; treating as success."
            exit 0
          fi

          echo "::error::PR #$PR merge failed and PR is still open"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
