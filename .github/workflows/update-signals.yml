name: Update macro signals

on:
  schedule:
    - cron: '47 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-signals
  cancel-in-progress: false

jobs:
  signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch macro signals (VIX · S&P · CNN F&G)
        run: node scripts/fetch-signals.mjs
      - name: Create protected-main PR if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE="signals.json"
          if [ -z "$(git status --porcelain "$FILE")" ]; then
            echo "No change in $FILE."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="claude/automation-update-signals-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$BRANCH"
          git add "$FILE"
          git commit -m "chore: update macro signals (VIX·S&P·F&G)"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "chore: update macro signals (VIX·S&P·F&G)" --body "Automated macro-signal refresh. Claude PR Gate validates and squash-merges this protected-main PR."
