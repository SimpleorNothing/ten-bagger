name: Apply external compute early warning

on:
  push:
    branches:
      - feat/external-compute-early-warning
    paths:
      - .github/workflows/apply-external-compute-early-warning.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/external-compute-early-warning
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source update
        run: python scripts/apply_external_compute_early_warning.py
      - name: Validate
        run: |
          node --check aisd.js
          git diff --check
      - name: Commit source update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aisd.js
          git commit -m "feat: add external compute contracts to early warning"
          git push origin HEAD:feat/external-compute-early-warning
