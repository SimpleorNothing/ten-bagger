name: Account live view CI

on:
  pull_request:
    paths:
      - 'account-live.js'
      - 'worker-hotfix.js'
      - 'scripts/test-account-live.mjs'
      - '.github/workflows/account-live-ci.yml'
  push:
    branches: [main]
    paths:
      - 'account-live.js'
      - 'worker-hotfix.js'
      - 'scripts/test-account-live.mjs'
      - '.github/workflows/account-live-ci.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax checks
        run: |
          node --check account-live.js
          node --check worker-hotfix.js
      - name: Static regression checks
        run: node scripts/test-account-live.mjs
