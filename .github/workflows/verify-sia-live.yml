name: Verify SIA live browser

on:
  workflow_run:
    workflows: ["Deploy to Cloudflare Workers"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed SIA endpoint and rendered card
        run: |
          set -euo pipefail
          BASE='https://ten-bagger.cw120-park.workers.dev'
          curl -fsSL --retry 3 --retry-delay 2 "$BASE/semi_sales.json" -o /tmp/semi_sales.json
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/semi_sales.json','utf8'));
          const last=d.series[d.series.length-1];
          const june=d.series.find(x=>x.ym==='2026-06');
          console.log('LIVE SIA JSON:',{latest:d.latest,last,june});
          if(d.latest?.ym!=='2026-07'||d.latest?.sales!==146.8||d.latest?.priorMonthSales!==137.9) throw new Error('latest mismatch');
          if(last?.ym!=='2026-07'||last?.sales!==146.8||june?.sales!==137.9) throw new Error('series mismatch');
          NODE

          mkdir -p /tmp/sia-live && cd /tmp/sia-live
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          cat > check.js <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1800}});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('https://ten-bagger.cw120-park.workers.dev/?sia-smoke='+Date.now(),{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForSelector('#nav .tab[data-v="market"]',{state:'visible',timeout:30000});
            await page.click('#nav .tab[data-v="market"]');
            await page.waitForSelector('#mkt_global_semi_sales',{state:'visible',timeout:45000});
            await page.waitForFunction(()=>{
              const t=document.getElementById('mkt_global_semi_sales')?.innerText||'';
              return t.includes('$146.8B')&&t.includes('+6.4% MoM')&&t.includes('6월 수정 $137.9B');
            },{timeout:45000});
            const result=await page.evaluate(()=>{
              const el=document.getElementById('mkt_global_semi_sales'); const r=el?.getBoundingClientRect();
              return {visible:!!el&&!!r&&r.width>0&&r.height>0,text:(el?.innerText||'').trim(),hasSvg:!!el?.querySelector('svg')};
            });
            console.log('LIVE SIA CARD:',JSON.stringify(result,null,2));
            for(const token of ['$146.8B','+6.4% MoM','YoY +135.1%','6월 수정 $137.9B','2026-07','SIA/WSTS']) if(!result.text.includes(token)) throw new Error('missing '+token);
            if(!result.visible||!result.hasSvg) throw new Error('card/chart not visibly rendered');
            const fatal=errors.filter(e=>/SyntaxError|semi_sales|global_semi/i.test(e)); if(fatal.length) throw new Error(JSON.stringify(fatal));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node check.js
