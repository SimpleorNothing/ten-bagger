name: Update news feed

on:
  schedule:
    - cron: '12,42 21 * * *'
    - cron: '12 22 * * *'
    - cron: '12,42 9 * * *'
    - cron: '12 10 * * *'
  workflow_dispatch: {}
  push:
    paths: ['.github/workflows/update-news.yml']

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Guard - 최근에 이미 갱신됐으면 스킵
        id: guard
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          FORCE_REFRESH: ${{ github.event_name == 'push' }}
        run: |
          if [ "$MANUAL" = "true" ] || [ "$FORCE_REFRESH" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          DECISION=$(node -e "try{const d=require('./news.json');const ageH=(Date.now()-new Date(d.asOf).getTime())/3600000;process.stdout.write(ageH<6?'skip':'run')}catch(e){process.stdout.write('run')}")
          if [ "$DECISION" = "skip" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: '20'
      - name: Fetch raw news without paid LLM API
        if: steps.guard.outputs.skip != 'true'
        run: node scripts/fetch-news.mjs
      - name: Create or update raw-news refresh PR
        id: cpr
        if: steps.guard.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update raw news feed"
          branch: automation/update-news
          branch-suffix: timestamp
          delete-branch: true
          title: "chore: update raw news feed"
          body: |
            Deterministic RSS/news refresh only. Paid LLM scoring, summarization and market-pulse synthesis are intentionally disabled and handled by the ChatGPT routine.
          add-paths: |
            news.json
            news_archive.json
            archive
      - name: Enable auto-merge for raw-news refresh PR
        if: steps.cpr.outputs.pull-request-number
        continue-on-error: true
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: squash
