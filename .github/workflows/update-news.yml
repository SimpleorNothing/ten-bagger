name: Update news feed

on:
  schedule:
    - cron: '12,42 21 * * *'
    - cron: '12 22 * * *'
    - cron: '12,42 9 * * *'
    - cron: '12 10 * * *'
  workflow_dispatch: {}
  push:
    paths: ['.github/workflows/update-news.yml']

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Guard - 최근에 이미 갱신됐으면 스킵
        id: guard
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          FORCE_REFRESH: ${{ github.event_name == 'push' }}
        run: |
          if [ "$MANUAL" = "true" ] || [ "$FORCE_REFRESH" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          DECISION=$(node -e "try{const d=require('./news.json');const ageH=(Date.now()-new Date(d.asOf).getTime())/3600000;process.stdout.write(ageH<6?'skip':'run')}catch(e){process.stdout.write('run')}")
          if [ "$DECISION" = "skip" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: '20'
      - name: Fetch raw news without paid LLM API
        if: steps.guard.outputs.skip != 'true'
        run: node scripts/fetch-news.mjs
        env:
          GEMINI_API_KEY: ''
      - name: Create protected-main PR when changed
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILES="news.json news_archive.json archive"
          if [ -z "$(git status --porcelain $FILES)" ]; then
            echo "No news changes."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="claude/automation-update-news-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$BRANCH"
          git add $FILES
          git commit -m "chore: update raw news feed"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "chore: update raw news feed" --body "Deterministic RSS/news refresh only. Paid LLM scoring, summarization and market-pulse synthesis are disabled. Claude PR Gate validates and squash-merges this protected-main PR."
