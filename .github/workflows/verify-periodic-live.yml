name: Verify periodic release live

on:
  workflow_run:
    workflows: ["Deploy to Cloudflare Workers"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
    steps:
      - name: Verify CPI, PPI and EIA live JSON, cards and charts
        run: |
          set -euo pipefail
          if [ -z "${SITE_PASSWORD:-}" ]; then echo 'ERROR: SITE_PASSWORD required'; exit 1; fi
          mkdir -p /tmp/periodic-live && cd /tmp/periodic-live
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          cat > check.js <<'NODE'
          const { chromium } = require('playwright');
          const BASE='https://simpleornothing.com';
          const pw=process.env.SITE_PASSWORD;
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:1440,height:2200}});
            const auth=await context.request.post(BASE+'/__auth',{form:{password:pw},timeout:30000});
            if(!auth.ok()) throw new Error('site auth failed: HTTP '+auth.status());
            const cpiReleaseResp=await context.request.get(BASE+'/cpi_release.json?t='+Date.now(),{timeout:30000,headers:{'Cache-Control':'no-cache'}});
            if(!cpiReleaseResp.ok()) throw new Error('live cpi_release.json HTTP '+cpiReleaseResp.status());
            const cpiRelease=await cpiReleaseResp.json();
            if(cpiRelease.latest?.ym!=='2026-08'||cpiRelease.latest?.headlineMom!==0.4||cpiRelease.latest?.headlineYoy!==3.4||cpiRelease.latest?.coreMom!==0.3||cpiRelease.latest?.coreYoy!==2.4||cpiRelease.latest?.prevHeadlineMom!==0.1||cpiRelease.latest?.prevCoreYoy!==2.5) throw new Error('live CPI release mismatch');
            const cpiResp=await context.request.get(BASE+'/cpi.json?t='+Date.now(),{timeout:30000,headers:{'Cache-Control':'no-cache'}});
            if(!cpiResp.ok()) throw new Error('live cpi.json HTTP '+cpiResp.status());
            const cpi=await cpiResp.json(), us=(cpi.series?.us||[]), cpiLast=us.at(-1), cpiPrev=us.at(-2);
            console.log('LIVE CPI JSON:',JSON.stringify({last:cpiLast,prev:cpiPrev,asOf:cpi.asOf},null,2));
            if(cpiLast?.[0]!=='2026-08-01'||cpiLast?.[1]!==3.4) throw new Error('live CPI series endpoint mismatch');
            if(cpiPrev?.[0]!=='2026-07-01'||cpiPrev?.[1]!==3.4) throw new Error('live CPI prior endpoint mismatch');
            const ppiResp=await context.request.get(BASE+'/ppi.json?t='+Date.now(),{timeout:30000,headers:{'Cache-Control':'no-cache'}});
            if(!ppiResp.ok()) throw new Error('live ppi.json HTTP '+ppiResp.status());
            const ppi=await ppiResp.json(), ppiLast=(ppi.series||[]).at(-1);
            if(ppi.latest?.ym!=='2026-08'||ppi.latest?.headlineMom!==0.4||ppi.latest?.headlineYoy!==5.4||ppi.latest?.coreMom!==0.3||ppi.latest?.coreYoy!==4.7||ppi.latest?.prevHeadlineMom!==0.1||ppi.latest?.prevCoreMom!==0.4) throw new Error('live PPI latest mismatch');
            if(ppiLast?.ym!=='2026-08'||ppiLast?.headlineMom!==0.4) throw new Error('live PPI series endpoint mismatch');
            const eiaResp=await context.request.get(BASE+'/eia_weekly.json?t='+Date.now(),{timeout:30000,headers:{'Cache-Control':'no-cache'}});
            if(!eiaResp.ok()) throw new Error('live eia_weekly.json HTTP '+eiaResp.status());
            const eia=await eiaResp.json(), eiaLast=(eia.series||[]).at(-1);
            if(eia.latest?.weekEnding!=='2026-09-04'||eia.latest?.commercialCrudeMb!==424.069||eia.latest?.previousMb!==424.46||eia.latest?.changeMb!==-0.391) throw new Error('live EIA latest mismatch');
            if(eiaLast?.weekEnding!=='2026-09-04'||eiaLast?.commercialCrudeMb!==424.069) throw new Error('live EIA series endpoint mismatch');
            const page=await context.newPage(); const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            await page.goto(BASE+'/?periodic-smoke='+Date.now(),{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForSelector('#nav .tab[data-v="market"]',{state:'visible',timeout:30000});
            await page.waitForSelector('#v-company',{state:'attached',timeout:30000});
            await page.waitForTimeout(250);
            await page.click('#nav .tab[data-v="market"]');
            await page.waitForFunction(()=>document.getElementById('v-market')?.classList.contains('on'),{timeout:10000});
            for (const id of ['#mkt_us_cpi','#mkt_us_ppi','#mkt_eia_weekly_crude']) await page.waitForSelector(id,{state:'visible',timeout:45000});
            await page.waitForFunction(()=>{const t=document.querySelector('#mkt_us_cpi')?.innerText||''; return t.includes('+0.4% MoM')&&t.includes('YoY +3.4%')&&t.includes('7월 +0.1%→8월 +0.4%')&&t.includes('근원 +0.3% MoM / +2.4% YoY')&&t.includes('2026-08');},{timeout:45000});
            await page.waitForFunction(()=>{const t=document.querySelector('#mkt_us_ppi')?.innerText||''; return t.includes('+0.4% MoM')&&t.includes('YoY +5.4%')&&t.includes('2026-08');},{timeout:45000});
            await page.waitForFunction(()=>{const t=document.querySelector('#mkt_eia_weekly_crude')?.innerText||''; return t.includes('424.069M bbl')&&t.includes('-0.391M')&&t.includes('2026-09-04');},{timeout:45000});
            const result=await page.evaluate(()=>{const out={};for(const id of ['mkt_us_cpi','mkt_us_ppi','mkt_eia_weekly_crude']){const el=document.getElementById(id);out[id]={text:(el?.innerText||'').trim(),hasSvg:!!el?.querySelector('svg')};}return out;});
            console.log('LIVE PERIODIC CARDS/CHART:',JSON.stringify(result,null,2));
            for(const [id,x] of Object.entries(result)) if(!x.hasSvg) throw new Error(id+' chart missing');
            const fatal=errors.filter(e=>/SyntaxError|cpi_release|cpi\.json|ppi\.json|eia_weekly|mkt_us_cpi|mkt_us_ppi|mkt_eia/i.test(e)); if(fatal.length) throw new Error('production browser errors: '+JSON.stringify(fatal));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node check.js
