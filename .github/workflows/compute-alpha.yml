name: Compute alpha map

on:
  schedule:
    - cron: '30 23 * * 5'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: compute-alpha
  cancel-in-progress: false

jobs:
  alpha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compute alpha estimates
        run: node scripts/compute-alpha.mjs
        env:
          GH_GIST_TOKEN: ${{ secrets.GH_GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
      - name: Open protected-main PR if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE="alpha.json"
          if [ -z "$(git status --porcelain "$FILE")" ]; then echo "No change in $FILE."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="claude/automation-compute-alpha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$BRANCH"
          git add "$FILE"
          git commit -m "chore: recompute alpha map estimates"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "chore: recompute alpha map estimates" --body "Automated alpha refresh through the protected-main PR path. Claude PR Gate validates and merges this branch."
