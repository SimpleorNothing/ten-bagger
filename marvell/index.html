<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Marvell 전략·현황 | Alpha Map</title>
<link rel="stylesheet" href="../pantone.css">
<style>
:root{--ink:#F0EFEB;--ink2:#ECEAE3;--panel:#fff;--panel2:#E9E7E0;--line:#dedbd3;--line2:#cbc7bd;--txt:#3d3935;--dim:#746F69;--faint:#989292;--dawn:#496176;--onacc:#fff;--st-dawn:#2f7d63;--st-accel:#2a6f97;--st-mature:#9a7b2f;--st-hot:#b4472f;--serif:'Pretendard Variable','Pretendard',system-ui,-apple-system,'Segoe UI',Roboto,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--txt);font-family:var(--serif);font-size:14px;line-height:1.55;background:linear-gradient(rgba(73,97,118,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(73,97,118,.045) 1px,transparent 1px),var(--ink);background-size:32px 32px;background-attachment:fixed}a{color:inherit}header{position:sticky;top:0;z-index:20;background:rgba(240,239,235,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line2)}header:after{content:"";display:block;height:4px;background:repeating-linear-gradient(90deg,var(--line2) 0 1px,transparent 1px 16px)}
.hrow{max-width:1340px;margin:0 auto;padding:13px 22px 10px;display:flex;gap:18px;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:13px;min-width:0}.brand a{text-decoration:none;font-weight:800;letter-spacing:.04em}.brand .slash{height:22px;width:1px;background:var(--line2)}.brand .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;gap:8px;align-items:center;color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}.pill{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:20px;padding:4px 9px;background:var(--panel);font-size:12px;font-weight:700;white-space:nowrap}.pill.accel{border-color:rgba(42,111,151,.4);color:var(--st-accel);background:rgba(42,111,151,.06)}
main{max-width:1340px;margin:0 auto;padding:34px 22px 72px}.vhead{margin-bottom:22px}.vkick{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--dawn);display:flex;align-items:center;gap:9px}.vkick:before{content:"";width:18px;height:1px;background:var(--dawn)}.vtitle{font-size:30px;line-height:1.2;letter-spacing:-.02em;margin:8px 0}.vtitle em{font-style:normal;color:var(--dawn)}.vsub{font-size:15px;color:var(--dim);max-width:900px;margin:0}.card,.axis,.timeline,.src-card,.risk-card,.fin-wrap,.visibility{background:var(--panel);border:1px solid var(--line);border-radius:3px}
.frame{padding:22px;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,.8fr);gap:22px;margin-bottom:14px}.frame h2{font-size:20px;margin:0 0 9px}.frame .statement{font-size:24px;line-height:1.3;font-weight:800;letter-spacing:-.02em;margin:4px 0 10px}.frame .redef{font-size:15px;color:var(--dim);max-width:860px}.frame ul{margin:14px 0 0;padding-left:20px}.frame li{margin:6px 0}.frame-side{border-left:1px solid var(--line);padding-left:20px;display:flex;flex-direction:column;justify-content:space-between;gap:18px}.frame-side .label,.section-label{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:700}.frame-side .big{font-size:20px;font-weight:800;margin-top:4px}.frame-side .note{color:var(--dim);font-size:14px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0 30px}.kpi{padding:15px 16px;background:var(--panel);border:1px solid var(--line);border-radius:3px}.kpi .label{font-size:12px;color:var(--faint);font-weight:700}.kpi .value{font-size:20px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:3px 0}.kpi .note{font-size:14px;color:var(--dim)}section.block{margin-top:32px}.sec-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:11px}.sec-head h2{font-size:20px;margin:0}.sec-head p{margin:0;color:var(--dim);font-size:14px}
.axes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.axis{padding:18px;transition:.14s}.axis:hover{border-color:var(--line2);box-shadow:0 4px 14px rgba(22,36,45,.06)}.axis-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.axis-code{font-size:12px;color:var(--faint);font-weight:800;letter-spacing:.08em}.axis h3{font-size:17px;line-height:1.3;margin:3px 0 4px}.axis .org{font-size:12px;color:var(--faint)}.axis .summary{font-size:15px;margin:14px 0;color:var(--txt)}.fact-box,.interp-box{padding:12px 13px;border-left:2px solid var(--line2);background:var(--ink);margin:10px 0}.fact-box b,.interp-box b{display:block;font-size:12px;letter-spacing:.06em;margin-bottom:5px}.fact-box ul{margin:0;padding-left:19px}.fact-box li{margin:4px 0}.interp-box{border-left-color:var(--dawn);color:var(--dim)}.kpi-list{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:12px}.kpi-line{font-size:14px;border-top:1px solid var(--line);padding-top:7px}.axis-foot{margin-top:14px;display:flex;gap:8px;align-items:center;justify-content:space-between}.axis-foot button{font:inherit;font-size:14px;font-weight:700;padding:7px 10px;border-radius:3px;border:1px solid var(--line2);background:var(--panel2);color:var(--txt);cursor:pointer}.axis-foot button:hover{border-color:var(--dawn)}.risk-inline{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:65%}.timeline{display:none;margin-top:10px;padding:13px}.timeline.on{display:block}.ev{display:grid;grid-template-columns:92px 52px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.ev:last-child{border-bottom:0}.ev-date{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}.ev-type{font-size:12px;font-weight:800;color:var(--dawn)}.ev-title{font-weight:700}.ev-detail{color:var(--dim);margin-top:2px}
.fin-wrap{overflow:hidden}table{width:100%;border-collapse:collapse}th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}th{font-size:12px;color:var(--faint);font-weight:800;background:var(--ink)}th:first-child,td:first-child{text-align:left}tr:last-child td{border-bottom:0}.fin-matrix th:not(:first-child),.fin-matrix td:not(:first-child){text-align:center}.fin-matrix th .kind{display:inline-block;margin-top:4px;font-weight:700}.fin-matrix td:first-child{white-space:nowrap}.kind{font-size:12px;border:1px solid var(--line2);border-radius:20px;padding:2px 7px;white-space:nowrap}.kind.management{color:var(--st-mature);border-color:rgba(154,123,47,.35)}.neg{color:var(--st-accel);font-weight:700}.pos{color:var(--st-hot);font-weight:700}.fin-note{margin-top:9px;color:var(--dim);font-size:14px}
.visibility{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:22px}.visibility h3{font-size:17px;margin:4px 0 8px}.visibility ul{margin:0;padding-left:20px}.visibility li{margin:6px 0}.next-box{background:var(--ink);border:1px solid var(--line);border-radius:3px;padding:15px}.next-box b{display:block;margin-bottom:6px}.risks{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.risk-card{padding:15px}.risk-card h3{font-size:15px;margin:0 0 5px}.risk-card p{font-size:14px;color:var(--dim);margin:0}.sources{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.src-card{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;text-decoration:none}.src-card:hover{border-color:var(--line2)}.src-name{font-weight:700}.src-type{font-size:12px;color:var(--faint);white-space:nowrap}.legend{display:flex;gap:7px;flex-wrap:wrap}.legend span{font-size:12px;color:var(--dim)}.error{padding:18px;border:1px solid var(--st-hot);background:var(--panel);color:var(--st-hot)}footer{margin-top:30px;padding-top:15px;border-top:1px solid var(--line);color:var(--faint);font-size:12px}
@media(max-width:900px){.frame{grid-template-columns:1fr}.frame-side{border-left:0;border-top:1px solid var(--line);padding-left:0;padding-top:16px}.kpi-grid{grid-template-columns:repeat(2,1fr)}.axes{grid-template-columns:1fr}.risks{grid-template-columns:repeat(2,1fr)}.visibility{grid-template-columns:1fr}.sources{grid-template-columns:1fr}}
@media(max-width:620px){.hrow{padding-left:14px;padding-right:14px}.brand .name{max-width:180px}.meta .hide-sm{display:none}main{padding:24px 14px 50px}.vtitle{font-size:26px}.kpi-grid{grid-template-columns:1fr 1fr;gap:7px}.kpi{padding:12px}.kpi .value{font-size:17px}.kpi .note{font-size:12px}.kpi-list{grid-template-columns:1fr}.risks{grid-template-columns:1fr}.fin-wrap{overflow:visible}table{table-layout:fixed}.fin-matrix th:first-child,.fin-matrix td:first-child{width:82px}th,td{padding:9px 4px;font-size:12px}.ev{grid-template-columns:78px 44px 1fr;gap:6px}}
@media print{header{position:static}body{background:#fff}main{max-width:none}.axis{break-inside:avoid}.timeline{display:block}}
</style>
</head>
<body>
<header><div class="hrow"><div class="brand"><a href="../">ALPHA MAP</a><span class="slash"></span><span class="name">Marvell 전략·현황</span></div><div class="meta"><span id="asof" class="hide-sm"></span><span class="pill accel" id="headStatus">불러오는 중</span></div></div></header>
<main>
<div class="vhead"><div class="vkick">Company Strategy Tracker</div><h1 class="vtitle">Marvell <em>전략·현황</em></h1><p class="vsub">samsungda.net CI의 전략 프레임·실행축·KPI 궤적·이벤트 타임라인 구조를 투자 분석에 맞게 재구성했습니다. 사실, 경영진 전망, 자체 해석을 분리해 표시합니다.</p></div>
<div id="app"><div class="card" style="padding:18px">데이터를 불러오는 중입니다.</div></div>
<footer>수치 기준: Marvell 회계연도. 경영진 전망은 실제 실적이 아니며 변경될 수 있습니다. 총 backlog는 회사가 정식 KPI로 공시하지 않아 임의 추정하지 않습니다.</footer>
</main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const num=v=>v==null?'없음':Number(v).toLocaleString('en-US',{maximumFractionDigits:1});
const pct=v=>v==null?'없음':`${v>0?'+':''}${num(v)}%`;
const marginClass=v=>v==null?'':v<0?'neg':'pos';
const kindLabel=k=>k==='actual'?'실적':k==='management'?'경영진 전망':k==='guidance'?'가이던스':'';
function axisHtml(a,i){const ev=a.events.map(e=>`<div class="ev"><div class="ev-date">${esc(e.date)}</div><div class="ev-type">${esc(e.type)}</div><div><div class="ev-title">${esc(e.title)}</div><div class="ev-detail">${esc(e.detail)}</div></div></div>`).join('');return `<article class="axis"><div class="axis-top"><div><div class="axis-code">${esc(a.code)} · ${esc(a.basis)}</div><h3>${esc(a.title)}</h3><div class="org">${esc(a.org)}</div></div><span class="pill accel">${esc(a.status)}</span></div><div class="summary">${esc(a.summary)}</div><div class="fact-box"><b>확인된 사실</b><ul>${a.facts.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="interp-box"><b>투자 해석</b>${esc(a.interpretation)}</div><div class="kpi-list">${a.kpis.map(k=>`<div class="kpi-line">${esc(k)}</div>`).join('')}</div><div class="axis-foot"><button type="button" data-timeline="tl-${i}" aria-expanded="false">타임라인 보기</button><div class="risk-inline" title="${esc(a.risks.join(' · '))}">주요 위험: ${esc(a.risks.join(' · '))}</div></div><div class="timeline" id="tl-${i}">${ev}</div></article>`}
function render(d){document.getElementById('asof').textContent=`update : ${d.asOf.replaceAll('-','.')}`;document.getElementById('headStatus').textContent=d.company.frame.status;const frame=d.company.frame;let out=`
<section class="card frame"><div><div class="section-label">전략 프레임</div><h2>${esc(d.company.name)} <span style="color:var(--faint);font-size:14px">${esc(d.company.ticker)}</span></h2><div class="statement">${esc(frame.statement)}</div><div class="redef">${esc(frame.redefinition)}</div><ul>${frame.evidence.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="frame-side"><div><div class="label">현재 실행 상태</div><div class="big">${esc(frame.status)}</div><div class="note">AI 수요가 bookings·매출·design win과 공급 선투자로 동시에 연결되는 구간</div></div><div><div class="label">핵심 질문</div><div class="note">FY2027~FY2028의 고성장이 Custom XPU, 1.6T optics, scale-up switching의 실제 매출과 이익 레버리지로 전환되는가</div></div></div></section>
<div class="kpi-grid">${d.headlineKpis.map(k=>`<div class="kpi"><div class="label">${esc(k.label)} · ${esc(kindLabel(k.kind))}</div><div class="value">${esc(k.value)}</div><div class="note">${esc(k.note)}</div></div>`).join('')}</div>
<section class="block"><div class="sec-head"><div><div class="section-label">Strategy Axes</div><h2>5개 전략축 실행 현황</h2></div><p>카드를 열면 축별 사건 타임라인을 확인할 수 있습니다.</p></div><div class="axes">${d.axes.map((a,i)=>axisHtml(a,i)).join('')}</div></section>
<section class="block"><div class="sec-head"><div><div class="section-label">Financial Trajectory</div><h2>FY2023~FY2028 실적·전망</h2></div><div class="legend"><span>실적 = GAAP</span><span>전망 = 경영진 콜</span></div></div><div class="fin-wrap"><table class="fin-matrix"><thead><tr><th>지표</th>${d.financials.map(r=>`<th><b>${esc(r.fy)}</b><br><span class="kind ${esc(r.kind)}">${esc(kindLabel(r.kind))}</span></th>`).join('')}</tr></thead><tbody><tr><td><b>매출($B)</b></td>${d.financials.map(r=>`<td>${num(r.revenue)}</td>`).join('')}</tr><tr><td><b>YoY</b></td>${d.financials.map(r=>`<td class="${marginClass(r.growth)}">${pct(r.growth)}</td>`).join('')}</tr><tr><td><b>영업이익률</b></td>${d.financials.map(r=>`<td class="${marginClass(r.opMargin)}">${pct(r.opMargin)}</td>`).join('')}</tr><tr><td><b>순이익률</b></td>${d.financials.map(r=>`<td class="${marginClass(r.netMargin)}">${pct(r.netMargin)}</td>`).join('')}</tr><tr><td><b>수주잔고</b></td>${d.financials.map(r=>`<td>${esc(r.backlog)}</td>`).join('')}</tr></tbody></table></div><div class="fin-note">FY2026 GAAP 순이익률은 자동차 Ethernet 사업 매각의 세전 이익 약 18억달러가 포함돼 정상 수익성보다 높습니다. FY2027E·FY2028E 영업·순이익률은 회사가 연간 GAAP 가이던스를 공시하지 않아 비워 두었습니다.</div></section>
<section class="block"><div class="sec-head"><div><div class="section-label">Order Visibility</div><h2>수주 가시성은 어떻게 볼 것인가</h2></div></div><div class="visibility"><div><h3>${esc(d.visibility.headline)}</h3><ul>${d.visibility.facts.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="next-box"><b>다음 확인 포인트</b>${esc(d.visibility.next)}</div></div></section>
<section class="block"><div class="sec-head"><div><div class="section-label">Risk Board</div><h2>전략 무효화·하방 위험</h2></div></div><div class="risks">${d.risks.map(r=>`<article class="risk-card"><h3>${esc(r.title)}</h3><p>${esc(r.detail)}</p></article>`).join('')}</div></section>
<section class="block"><div class="sec-head"><div><div class="section-label">Sources</div><h2>검증 원문</h2></div><p>공시·회사 발표를 우선하고 전망 수치만 원문 보도를 보조 사용했습니다.</p></div><div class="sources">${d.sources.map(s=>`<a class="src-card" href="${esc(s.url)}" target="_blank" rel="noopener"><span class="src-name">${esc(s.id)} · ${esc(s.label)}</span><span class="src-type">${esc(s.type)}</span></a>`).join('')}</div></section>`;document.getElementById('app').innerHTML=out;document.querySelectorAll('[data-timeline]').forEach(btn=>btn.addEventListener('click',()=>{const id=btn.getAttribute('data-timeline'),box=document.getElementById(id),open=box.classList.toggle('on');btn.textContent=open?'타임라인 닫기':'타임라인 보기';btn.setAttribute('aria-expanded',open?'true':'false')}))}
fetch('data.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()}).then(render).catch(err=>{document.getElementById('headStatus').textContent='데이터 오류';document.getElementById('app').innerHTML=`<div class="error">Marvell 전략 데이터를 불러오지 못했습니다. ${esc(err.message)}</div>`});
</script>
</body>
</html>
